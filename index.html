<script>
/* Lifecycle stays inline: even a missing effect script cannot trap the visitor. */
(function () {
  var loader = document.getElementById('ll-loader'), timer = 0, finishTimer = 0, revealTimer = 0, effects = [], oldOverflow = '', focusBack = null, focusIn = false, outMs = 0, skipReady = false;
  var media = matchMedia('(prefers-reduced-motion: reduce)');
  var fast = false;
  try { fast = sessionStorage.getItem('lucy.intro.heist.seen') === '1' || sessionStorage.getItem('lucy.page.seen') === '1'; sessionStorage.setItem('lucy.intro.heist.seen', '1'); } catch(e) {}
  // Coming home from another page of the site (All Work's about link, a case study's name) is not a first visit, even
  // when the visit began on that page: it gets the short loading screen, never the heist (Lucy, 2026-10-25).
  try { if (document.referrer && new URL(document.referrer).origin === location.origin) fast = true; } catch(e) {}
  // lucyliu.xyz/hell (vercel.json rewrites it to this page): the same site, opening on the heist
  // gone to hell (see heist-opening.js). It always plays there. ?hell does the same for local runs.
  var hell = window.__hell = /^\/hell\/?$/i.test(location.pathname) || /[?&]hell(?:[=&]|$)/.test(location.search);
  // The opening is the paperclip heist (components/heist-opening.js; Lucy, 2026-10-21: "wheres
  // loading screen new"). /hell plays it in its hell mode and ?heist on every visit, for review.
  // The contact sheet's markup stays as what shows if the heist cannot load.
  var heist = window.__heist = true;
  if (hell || /[?&]heist(?:[=&]|$)/.test(location.search)) fast = false;
  if (!hell && /[?&]spot(?:[=&]|$)/.test(location.search)) fast = true;   // ?spot: the short screen even on a first visit, for review
  window.__loaderFast = fast;
  // Every load after the first in the tab gets the short loading screen instead of nothing (Lucy, 2026-10-22: "just
  // as a normal loading screen; the enter portfolio one ... only plays once per visit"): caught in the spotlight,
  // about two seconds (components/spotlight-opening.js, fetched only when it plays). /hell and ?heist play the heist.
  // Since 2026-11-24 a repeat visit gets no loading screen at all (Lucy: "repeat visits shoukdnt see loader"; a
  // screener clicking through many portfolios should land on the work). ?spot still plays the short screen, for review.
  var spotReview = !hell && /[?&]spot(?:[=&]|$)/.test(location.search);
  var spot = window.__spot = fast && spotReview && !media.matches;
  window.addEventListener('app:ready', function () { window.__appReady = true; });   // the spotlight's bar fills only once the page has mounted
  // A throwing effect must not keep the overlay up.
  function beginEffects() { effects.forEach(function (f) { try { f[0](); } catch(e) {} }); }
  function stopEffects() { effects.forEach(function (f) { try { f[1](); } catch(e) {} }); }
  function finish() {
    clearTimeout(timer); clearTimeout(finishTimer); clearTimeout(revealTimer);
    stopEffects();
    // exit() disables the skip button, which drops a focus it held to the body, so it notes first whether focus was in
    // the overlay; a replay always goes back to Replay opening (the page under the overlay is inert meanwhile).
    var hadFocus = focusIn || !!focusBack || loader.contains(document.activeElement);
    loader.classList.remove('intro-active', 'intro-live'); loader.classList.add('ll-gone'); loader.hidden = true;
    document.body.classList.remove('intro-playing');
    loader.querySelectorAll('img').forEach(function(img){img.removeAttribute('src');});
    document.body.style.overflow = oldOverflow;
    var content = document.getElementById('root'); if (content) content.inert = false;
    if (hadFocus) { var target = focusBack || document.getElementById('main-content'); if (target) target.focus({preventScroll:true}); }
    document.removeEventListener('keydown', keys);
  }
  // instant: any key, a press, the button. hard: the skip link, a hidden tab, reduced motion, a repeat visit.
  // An opening that asked for time to hand over (LucyIntro.hold) gets it unless the exit is hard.
  function exit(instant, hard) {
    if (instant && !hard && !skipReady) return;
    if (loader.classList.contains('is-done')) { if (instant) finish(); return; }
    if (loader.contains(document.activeElement)) focusIn = true;
    skipReady = false; loader.classList.remove('intro-skip-ready'); loader.querySelector('.intro-skip').disabled = true;
    clearTimeout(timer); loader.classList.add('is-done');
    window.__loaderExited = true;
    document.body.classList.add('loader-done');
    try { window.dispatchEvent(new CustomEvent('loader:exit')); } catch(e) {}
    stopEffects();
    if (hard || media.matches || (instant && !outMs)) finish(); else finishTimer = setTimeout(finish, outMs || 850);
  }
  // Any key skips after the visible prompt fades in; a modifier on its own or a browser shortcut does not.
  function keys(e) {
    if (e.target.closest && e.target.closest('.intro-sound')) return;
    if (!skipReady) return;
    if (/^(Shift|Control|Alt|Meta|CapsLock|Fn|FnLock|OS|Hyper|Super|Dead|Unidentified)$/.test(e.key) || e.metaKey || e.ctrlKey || e.isComposing) return;
    e.preventDefault(); exit(true);
  }
  function open(replay) {
    clearTimeout(timer); clearTimeout(finishTimer); clearTimeout(revealTimer);
    if (media.matches) { exit(true, true); return; }
    focusBack = replay ? document.activeElement : null; focusIn = false;
    oldOverflow = document.body.style.overflow;
    loader.hidden = false; loader.classList.remove('ll-gone','is-done','intro-skip-ready'); loader.classList.add('intro-active');
    skipReady = false;
    var skipButton = loader.querySelector('.intro-skip'); skipButton.disabled = true;
    // the heist's dark stage from the first frame, not the contact sheet while its script arrives; on a repeat load,
    // the spotlight's (a replay always plays the heist)
    var spotNow = spot && !replay;
    loader.classList.remove('intro-spot', 'intro-heist');
    if (spotNow) loader.classList.add('intro-spot');
    else if (heist) loader.classList.add('intro-heist');
    document.body.style.overflow = 'hidden';
    document.body.classList.add('intro-playing');
    var content = document.getElementById('root'); if (content) content.inert = true;
    document.addEventListener('keydown', keys);
    var sound = loader.querySelector('.intro-sound');
    sound.hidden = spotNow || !(window.AudioContext || window.webkitAudioContext);
    play(replay);
  }
  // Sound is an explicit choice; the animation never waits for an audio permission gesture.
  window.__introSound = false;
  var soundButton = loader.querySelector('.intro-sound');
  function soundLabel() {
    soundButton.setAttribute('aria-pressed', String(window.__introSound));
    soundButton.setAttribute('aria-label', window.__introSound ? 'Mute opening sound' : 'Enable opening sound');
  }
  soundButton.addEventListener('click', function () {
    var on = !window.__introSound;
    if (!on) { window.__introSound = false; if (window.__heistAC) window.__heistAC.suspend().catch(function(){}); soundLabel(); return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!window.__heistAC) window.__heistAC = new AC();
      window.__heistAC.resume().then(function () { window.__introSound = window.__heistAC.state === 'running'; soundLabel(); }).catch(function () { window.__introSound = false; soundLabel(); });
    } catch(e) { window.__introSound = false; soundLabel(); }
  });
  function play(replay) {
    var spotNow = spot && !replay, skipButton = loader.querySelector('.intro-skip');
    // Skippable from the first frame (Lucy, 2026-11-24: "skip immediatly, but the press anywhere to skip shows
    // first, black screen then 0.5 secs after loads in"); the heist itself waits HEIST_DELAY (heist-opening.js).
    skipReady = true; skipButton.disabled = false; loader.classList.add('intro-skip-ready');
    if (replay) skipButton.focus();
    loader.classList.remove('intro-stage-in');
    revealTimer = setTimeout(function () { loader.classList.add('intro-stage-in'); }, 500);
    // Duration is choreography, never presented as download progress. Backstop works without the renderer.
    timer = setTimeout(function () { exit(false); }, spotNow ? 2400 : 3100);
    beginEffects();
    if (replay) skipButton.focus();
  }
  loader.querySelector('.intro-skip').addEventListener('click', function () { if (skipReady) exit(true); });
  // A press anywhere on the first visit's opening skips it, as its hint says (Lucy, 2026-10-28). The short screen's
  // engine does this itself in spot mode; a press on the button is left to its click, so it never counts twice.
  loader.addEventListener('pointerdown', function (e) {
    if (skipReady && loader.classList.contains('intro-heist') && !loader.classList.contains('intro-spot') && !e.target.closest('button')) exit(true);
  });
  document.querySelector('.skip-link').addEventListener('click', function (e) { if (!skipReady) { e.preventDefault(); return; } exit(true, true); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && loader.classList.contains('intro-active')) exit(true, true); });
  media.addEventListener('change', function () { if (media.matches) exit(true, true); });
  // The heist loads only when the opening plays (a first visit, ?heist, /hell) or is replayed: it
  // tells the nav wordmark to rest for the name it flies in, so a skipped opening must not load it.
  var heistReq = false;
  // __loaderWave parks the nav wordmark for the flown name; set here too, because on a warm phone React mounted the nav ~80ms before the script could set it
  function loadHeist() { if (heistReq || !heist || media.matches) return; heistReq = true; window.__loaderWave = true; var hp = document.createElement('script'); hp.async = true; hp.src="components/heist-opening.js?v=8"; document.head.appendChild(hp); }
  var spotReq = false;
  function loadSpot() { if (spotReq || !spot || media.matches) return; spotReq = true; var sp = document.createElement('script'); sp.async = true; sp.src="components/spotlight-opening.js?v=10"; document.head.appendChild(sp); }
  window.LucyIntro = { replay:function(){if(!loader.classList.contains('intro-active')){loadHeist();open(true);}}, mount:function(begin,stop){effects.push([begin,stop]);if(loader.classList.contains('intro-active')&&!loader.classList.contains('is-done'))begin();}, exit:exit,
    // hold(ms, out): an opening longer than the backstop moves it to ms; out is how long its hand-over runs before the overlay goes
    hold:function(ms,out){if(out!=null)outMs=out;if(ms!=null&&loader.classList.contains('intro-active')&&!loader.classList.contains('is-done')){clearTimeout(timer);timer=setTimeout(function(){exit(false);},ms);}} };
  // deploy stamps loadHeist's src with a content hash
  if (!fast) loadHeist();
  if (spot) loadSpot();
  if (media.matches || (fast && !spot)) exit(true, true); else open(false);   // a first visit plays the heist; every load after it opens straight on the page
})();
</script>

function loadProjects() {
  try {
    const raw = localStorage.getItem('lucy.projects');
    if (raw) {
      const parsed = JSON.parse(raw);
      const expected = DEFAULT_PROJECTS.map(function(p) { return p.id; }).sort().join(',');
      const cached   = Array.isArray(parsed) ? parsed.map(function(p) { return p.id; }).sort().join(',') : '';
      if (cached === expected) {
        // Order, covers, and the standout rank flags are code-owned: they come from
        // DEFAULT_PROJECTS, never the cache — otherwise a stale localStorage entry keeps
        // serving old/404 cover paths or an old card order after the source changes.
        // Reviewed project copy also comes from source so stale editor caches cannot restore old claims.
        return DEFAULT_PROJECTS.map(function(d) {
          const c = parsed.find(function(p) { return p.id === d.id; }) || {};
          return Object.assign({}, c, { cover: d.cover, coverPos: d.coverPos, coverVideo: d.coverVideo, coverPoster: d.coverPoster, subtitle: d.subtitle, description: d.description, problem: d.problem, approach: d.approach, outcome: d.outcome, title: d.title, year: d.year, timeline: d.timeline, tools: d.tools, featured: d.featured, spotlight: d.spotlight, wip: d.wip });
        });
      }
    }
  } catch {}
  return DEFAULT_PROJECTS;
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "blue",
  "heroStyle": "editorial",
  "reduceMotion": false
}/*EDITMODE-END*/;

function applyTweaks(t) {
  const root = document.documentElement;
  const accents = {
    blue:     { c1: '#72ADFF', c2: '#A0C8FF', c3: '#C4B0FF' },
    lavender: { c1: '#C4B0FF', c2: '#E8E0FF', c3: '#A0C8FF' },
    warm:     { c1: '#F5C0A0', c2: '#F0A8A8', c3: '#E8B4C0' },
    mono:     { c1: '#E2EEFF', c2: '#A0C8FF', c3: '#72ADFF' },
  };
  const a = accents[t.accentColor] || accents.blue;
  /* 'blue' IS the stylesheet default, so writing it back as an inline style on <html> only
     does harm: an inline property outranks every rule, including :root.theme-light, so the
     dark-tuned hexes below were overriding the light theme's accent tokens on every load.
     That silently undid --fg-accent: #1552B8, the value colors_and_type.css introduced
     precisely because #4A8FEF only reaches ~2.8:1 on the light field. Clearing the
     properties instead hands both themes back to the stylesheet; the non-default accents
     still override, which is what a tweak is for. */
  const ACCENT_KEYS = ['--accent', '--fg-accent', '--fg-accent-dim', '--aura', '--aura-radial'];
  if ((t.accentColor || 'blue') === 'blue') {
    ACCENT_KEYS.forEach(k => root.style.removeProperty(k));
  } else {
    root.style.setProperty('--accent',       a.c1);
    root.style.setProperty('--fg-accent',    a.c1);
    root.style.setProperty('--fg-accent-dim',a.c2);
    root.style.setProperty('--aura', `linear-gradient(135deg, ${a.c2} 0%, ${a.c3} 55%, ${a.c1} 100%)`);
    root.style.setProperty('--aura-radial', `radial-gradient(circle, ${a.c1}33 0%, ${a.c3}1f 40%, transparent 70%)`);
  }
  if (t.reduceMotion) root.classList.add('reduce-motion'); else root.classList.remove('reduce-motion');
}

function TweaksPanel({ tweaks, setTweaks, open, onClose }) {
  const set = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    applyTweaks(next);
    window.parent?.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };
  const accents = ['blue','lavender','warm','mono'];
  return (
    <div className={'tweaks-panel' + (open ? ' is-open' : '')}>
      <div className="tweaks-head">
        <h4>Tweaks</h4>
        <small>live</small>
      </div>

      <div className="tweak-row">
        <label>accent</label>
        <div className="tweak-chips">
          {accents.map(a => (
            <button key={a} className={'tweak-chip' + (tweaks.accentColor===a?' on':'')} aria-pressed={tweaks.accentColor===a} onClick={() => set('accentColor', a)}>{a}</button>
          ))}
        </div>
      </div>

      <div className="tweak-row">
        <label>hero style</label>
        <div className="tweak-chips">
          {['editorial','minimal'].map(s => (
            <button key={s} className={'tweak-chip' + (tweaks.heroStyle===s?' on':'')} aria-pressed={tweaks.heroStyle===s} onClick={() => set('heroStyle', s)}>{s}</button>
          ))}
        </div>
      </div>

      <div className="tweak-row">
        <label>motion</label>
        <div className="tweak-chips">
          <button className={'tweak-chip' + (!tweaks.reduceMotion?' on':'')} aria-pressed={!tweaks.reduceMotion} onClick={() => set('reduceMotion', false)}>full</button>
          <button className={'tweak-chip' + (tweaks.reduceMotion?' on':'')} aria-pressed={tweaks.reduceMotion} onClick={() => set('reduceMotion', true)}>reduced</button>
        </div>
      </div>

      <button className="tweak-chip" style={{alignSelf:'flex-start'}} onClick={onClose}>close ×</button>
    </div>
  );
}

function App() {
  const [projects] = useState(loadProjects);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [aboutOpen, setAboutOpen] = useState(false);
  const [wavesActive, setWavesActive] = useState(false);
  const waveZoneRef = React.useRef(null);

  useEffect(() => {
    applyTweaks(tweaks);
    window.dispatchEvent(new Event('app:ready'));
  }, []);

  // Tweaks protocol
  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent?.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  // About is a menu-only view (not in the scroll). Hash #about is the single source of
  // truth so nav links, the constellation node, and cross-page index.html#about all work.
  useEffect(() => {
    const sync = () => setAboutOpen(location.hash === '#about');
    sync();
    window.addEventListener('hashchange', sync);
    return () => window.removeEventListener('hashchange', sync);
  }, []);

  useEffect(() => {
    if (aboutOpen) { try { window.__lenis?.stop(); } catch (e) {} }
    else { try { window.__lenis?.start(); } catch (e) {} }
    document.body.classList.toggle('about-locked', aboutOpen);
    // Covered canvases do not need to keep rendering beneath the full-screen drawer.
    document.dispatchEvent(new Event('lucy:scene-visibility'));
    if (!aboutOpen) return;
    const about = document.querySelector('.about-overlay');
    // The drawer can hide its close control during the automatic dive; the named
    // dialog stays available throughout that transition.
    const releaseFocus = window.LucyFocusScope(about, about, document.querySelector('.flow-menu-toggle'));
    // Reveal-fix: the overlay has its own scroll container, so window ScrollTriggers never
    // fire in here. The About title no longer uses [data-split-reveal] (the splitter rebuilds
    // innerHTML from textContent, which ate the <em> the aura word needs), but clear any
    // stray inline state GSAP may have left on it. Every other entrance in here is pure CSS
    // keyed to .is-open.
    try {
      const title = about.querySelector('.scene-title');
      if (window.gsap && title) gsap.set(title, { clearProps: 'all', opacity: 1, y: 0 });
    } catch (e) {}
    // The lockpick drawer (components/about-drawer.js) owns About's scene. Nothing of it is
    // fetched until this point (its data and sheets, ~160KB), so the home page pays nothing
    // for a view nobody has opened. The first open mounts the engine and plays the bending;
    // close pauses every clock; reopening picks up where it was without a second download.
    // Reduced motion shows the open drawer (the engine checks that itself).
    let drawer = null;
    try {
      const root = document.querySelector('.about-overlay .scene-about');
      if (root && window.AboutDrawerMount) { drawer = window.AboutDrawerMount(root); drawer.resume(); window.__aboutDrawer = drawer; }   // __aboutDrawer: the checks' hook
      // Inside the drawer (components/drawer-inside.js, Lucy, Oct 29): once the engine is in, the inside mounts over its
      // stage, and every open it watches for him to be up to go back in if that is where you were.
      if (drawer) drawer.ready.then(() => {
        if (!window.DrawerInside || !drawer.inner) return;
        if (!window.__drawerInside) window.__drawerInside = window.DrawerInside.mount(root, drawer.inner);
        if (window.__drawerInside) window.__drawerInside.sync();
      });
    } catch (e) {}

    const onKey = (e) => { if (e.key === 'Escape') closeAboutSoft(); };
    window.addEventListener('keydown', onKey);
    return () => {
      window.removeEventListener('keydown', onKey);
      releaseFocus();
      // Closing stops the scene: a canvas drawing behind a hidden view is battery and main
      // thread spent on nothing.
      try { if (drawer) drawer.pause(); } catch (e) {}
    };
  }, [aboutOpen]);

  const closeAbout = () => {
    setAboutOpen(false);
    if (location.hash === '#about') history.replaceState(null, '', location.pathname + location.search);
  };

  // Closing About from its button, Escape or the backdrop: he ducks into his drawer first (the
  // engine's duck, a second), then the overlay goes. The menu's hash change closes it at once.
  const closeAboutSoft = () => {
    const d = window.__aboutDrawer && window.__aboutDrawer.inner;
    if (d && d.duck) d.duck(closeAbout); else closeAbout();
  };

  // A card in About that points to a place on the home page (the tooth gem: "See the gem chapter", Oct 29): About closes
  // at once, then the page goes there (Lenis, once the scroll lock has let go).
  useEffect(() => {
    const go = (e) => {
      const target = document.querySelector(e.detail); if (!target) return;
      closeAbout();
      setTimeout(() => { if (window.__lenis) window.__lenis.scrollTo(target, { offset: -80 }); else target.scrollIntoView({ behavior: 'smooth' }); }, 180);
    };
    document.addEventListener('about-goto', go);
    return () => document.removeEventListener('about-goto', go);
  }, []);

  // Smooth scroll anchor clicks; #about opens the menu-only About view instead.
  const onNavClick = (e) => {
    const href = e.currentTarget.getAttribute('href');
    if (!href || !href.startsWith('#')) return;
    e.preventDefault();
    if (href === '#about') { location.hash = 'about'; return; }
    const target = document.querySelector(href);
    if (target && window.__lenis) window.__lenis.scrollTo(target, { offset: -80 });
    else target?.scrollIntoView({ behavior: 'smooth' });
  };

  const onOpenProject = (p) => {
    try { localStorage.setItem('lucy.projects', JSON.stringify(projects)); } catch {}
  };

  // Show the Waves backdrop only while the Spotlight zone is on screen AND Capabilities has
  // not arrived. The zone observer alone could never do this: .wave-zone sits immediately
  // before <SkillsSection/>, so its tail was still intersecting long after "What I do." had
  // filled the screen, and a fixed grid of 14px-gapped lines sat over the one headline that
  // is supposed to be read. Capabilities brings its own world (the night drive), so the line
  // field has no business there.
  useEffect(() => {
    const el = waveZoneRef.current;
    if (!el) return;
    const skills = document.querySelector('.scene-skills');
    let inZone = false, inSkills = false;
    const apply = () => setWavesActive(inZone && !inSkills);
    const ioZone = new IntersectionObserver(
      (entries) => { inZone = entries[0].isIntersecting; apply(); },
      { threshold: 0, rootMargin: '0px 0px -25% 0px' }
    );
    ioZone.observe(el);
    // Capabilities counts as arrived once its top edge crosses 40% up the viewport, which
    // is early enough that the lines are gone before the headline is readable.
    let ioSkills = null;
    if (skills) {
      ioSkills = new IntersectionObserver(
        (entries) => { inSkills = entries[0].isIntersecting; apply(); },
        { threshold: 0, rootMargin: '0px 0px -60% 0px' }
      );
      ioSkills.observe(skills);
    }
    return () => { ioZone.disconnect(); if (ioSkills) ioSkills.disconnect(); };
  }, []);

  const wavesEnabled = false && typeof Waves !== 'undefined' && window.innerWidth > 760 && !window.matchMedia('(pointer: coarse)').matches &&
    !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  return (
    <>
      {/* The custom pixel cursor is retired (Lucy, 2026-10-31: "i dont like the hover it too distracting"; she chose the
          normal cursor). components/TargetCursor.jsx stays on disk. */}
      <Nav onNavClick={onNavClick} />
      {/* Viewport-fixed Waves backdrop, shown only while the Spotlight zone is in view
          (IntersectionObserver). Fades out as the Capabilities header arrives. */}
      {wavesEnabled && (
        <Waves
          className={'zone-waves' + (wavesActive ? ' is-active' : '')}
          lineColor="#169eff"
          waveSpeedX={0.015}
          waveSpeedY={0.008}
          waveAmpX={34}
          waveAmpY={18}
          xGap={14}
          yGap={36}
          friction={0.92}
          tension={0.008}
          maxCursorMove={40}
        />
      )}
      <main id="main-content" tabIndex="-1">
        <Hero />
        {/* Standout work is retired (Lucy, 2026-10-31: "remove standout work section? and only in hero to simplify
            website"): the hero carries the three projects. Capabilities left home the same day (Lucy, "7" on
            "Capabilities Layouts"): her tools run in the hero, and the With AI band follows the marquee on laptops and
            phones too. The night drive keeps its own page, capabilities.html. */}
        <Marquee />
        <WithAiSection />
        {/* Off hours left home on 2026-11-11 (Lucy: "removr offhours on hero main website page"); off-hours.html stays,
            reached from About's drawer. OffHoursSection stays in Skills.jsx, unmounted. */}
      </main>
      {/* The site's shared footer (components/site-footer.js; Lucy, 2026-10-31), under Lights out. The engine owns its
          children, so React renders it empty; data-top="instant" makes Back to top jump past the pinned chapters. */}
      <footer data-site-footer="" data-top="instant" ref={(el) => { if (el && window.SiteFooter && window.SiteFooter.mount) window.SiteFooter.mount(el); }} />
      <div
        className={'about-overlay' + (aboutOpen ? ' is-open' : '')}
        role="dialog"
        tabIndex="-1"
        aria-modal="true"
        aria-label="About Lucy Liu"
        aria-hidden={!aboutOpen}
        onClick={(e) => { if (e.target === e.currentTarget) closeAboutSoft(); }}
      >
        <button type="button" className="about-overlay-close" aria-label="Close about (Esc)" onClick={closeAboutSoft} />
        {/* data-lenis-prevent: Lenis is stopped while the overlay is open and a stopped
            Lenis swallows wheel events window-wide; this opts the overlay's native
            scroller out so it keeps scrolling. */}
        <div className="about-overlay-scroll" data-lenis-prevent="true">
          <AboutSection open={aboutOpen} />
        </div>
      </div>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} open={tweaksOpen} onClose={() => setTweaksOpen(false)} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// ============================================================
// GSAP + LENIS: animation system
// ============================================================
// Wait for React to mount (Babel fetches JSX async; 'load' fires too early on Vercel)
(function() {
  let fired = false;
  function go() { if (!fired) { fired = true; initAnimations(); } }
  window.addEventListener('app:ready', go);
  // Fallback: if app:ready never fires (e.g. React error), still run after 4s
  window.addEventListener('load', () => setTimeout(go, 4000));
})();

function initAnimations() {
  // Native touch scrolling: never hide content or scrub desktop transforms on phones.
  // Coarse pointers also cover landscape phones and tablets wider than the breakpoint.
  if (matchMedia('(max-width: 760px), (pointer: coarse)').matches) {
    const bar = document.querySelector('.scroll-progress');
    let frame = 0;
    function progress() {
      frame = 0;
      const range = document.documentElement.scrollHeight - innerHeight;
      if (bar) bar.style.transform = 'scaleX(' + (range > 0 ? Math.min(1, Math.max(0, scrollY / range)) : 0) + ')';
    }
    function schedule() { if (!frame) frame = requestAnimationFrame(progress); }
    addEventListener('scroll', schedule, { passive: true });
    addEventListener('resize', schedule, { passive: true });
    progress();
    return;
  }
  if (!window.gsap || !window.ScrollTrigger) return;
  gsap.registerPlugin(ScrollTrigger);
  initHeroCanvas();

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
    || document.documentElement.classList.contains('reduce-motion');

  // --- Lenis smooth scroll ---
  if (window.Lenis && !reduceMotion) {
    const lenis = new Lenis({
      duration: 1.15,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      wheelMultiplier: 0.9,
    });
    window.__lenis = lenis;
    if (window.ScrollLandings) ScrollLandings.install(lenis);   // components/scroll-landings.js
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);
  }

  // --- Scroll progress bar ---
  gsap.to('.scroll-progress', {
    scaleX: 1, ease: 'none',
    scrollTrigger: { trigger: document.body, start: 'top top', end: 'bottom bottom', scrub: true },
  });

  if (reduceMotion) { initFallback(); return; }

  // --- Hero: split characters (run now so DOM is ready; animation fires on loader:exit) ---
  document.querySelectorAll('.hero-heading .word').forEach(w => {
    const txt = w.textContent;
    const asciiWord = w.getAttribute('data-ascii');
    const aStart = asciiWord ? txt.indexOf(asciiWord) : -1;
    const aEnd = aStart >= 0 ? aStart + asciiWord.length : -1;
    w.textContent = '';
    [...txt].forEach((c, i) => {
      const s = document.createElement('span');
      s.className = (aStart >= 0 && i >= aStart && i < aEnd) ? 'char hero-ascii-char' : 'char';
      s.textContent = c === ' ' ? '\u00A0' : c;
      w.appendChild(s);
    });
  });
  const chars = document.querySelectorAll('.hero-heading .char');

  // Hero elements are visible by default (CSS). gsap.from() adds entrance flourish
  // without making anything invisible \u2014 if animation never fires, content stays visible.
  const heroEl = document.querySelector('.scene-hero');
  const legacyHero = heroEl && !heroEl.hasAttribute('data-room');
  // Keep the enlarged backdrop clipped while the opening hands off.
  if (heroEl) heroEl.style.overflow = 'clip';

  function playHeroEntrance() {
    const tl = gsap.timeline({
      onComplete: () => { if (heroEl) heroEl.style.overflow = ''; },
    });

    if (legacyHero) tl.from('.hero-orb', { opacity: 0, scale: 0.8, duration: 0.9, ease: 'expo.out' }, 0);
    if (chars.length) tl.from(chars, {
      yPercent: 120, skewX: 10, opacity: 0,
      duration: 1.1, stagger: { each: 0.022 }, ease: 'expo.out',
    }, 0);
    tl.from(['.hero-name-row--role', '.hero-tools', '.hero-covers', '.hero-links', '.hero-avail'], {
      y: 40, opacity: 0, duration: 0.9, stagger: 0.07, ease: 'expo.out',
    }, 0.66);
  }

  if (window.__loaderExited) {
    playHeroEntrance();
  } else {
    window.addEventListener('loader:exit', playHeroEntrance, { once: true });
  }

  // --- Hero parallax layers (3 speeds) ---
  if (legacyHero) {
  gsap.to('.hero-bg-layer', {
    y: '15%', ease: 'none',
    scrollTrigger: { trigger: '.scene-hero', start: 'top top', end: 'bottom top', scrub: true },
  });
  gsap.to('.hero-orb', {
    y: '-10%', scale: 1.1, ease: 'none',
    scrollTrigger: { trigger: '.scene-hero', start: 'top top', end: 'bottom top', scrub: 0.8 },
  });
  }
  // --- B: Cinematic word choreography on scroll-out ---
  // Desktop only. The tweens are timed to a hero that is exactly one viewport tall, so the
  // words dissolve as they leave the screen. On a phone the stacked hero is taller than
  // the viewport, so the same timings fire while the words are still on screen: "Lucy"
  // balloons past the edge and the last word blinks out mid-view (steps(1) below).
  const cinematicHero = window.innerWidth >= 760;
  const [wm0, wm1, wm2] = cinematicHero ? document.querySelectorAll('.hero-heading .word-mask') : [];
  // "Design": expands outward and dissolves (approach a giant title card)
  if (wm0) gsap.to(wm0, {
    scale: 3.0, opacity: 0, transformOrigin: 'left center',
    ease: 'power1.in',
    scrollTrigger: { trigger: '.scene-hero', start: 'top top', end: '40% top', scrub: 1.6 },
  });
  // "for the": peels left and up, compresses
  if (wm1) gsap.to(wm1, {
    x: '-10vw', y: -50, opacity: 0,
    ease: 'none',
    scrollTrigger: { trigger: '.scene-hero', start: '6% top', end: '46% top', scrub: 1.2 },
  });
  // "human mind.": holds until 80% of range, then hard editorial cut
  if (wm2) gsap.to(wm2, {
    opacity: 0,
    ease: 'steps(1)',
    scrollTrigger: { trigger: '.scene-hero', start: '24% top', end: '56% top', scrub: true },
  });
  // --- Hero mouse parallax on orb ---
  // Cache the element and gate the per-frame ticker on hero visibility so it stops
  // doing work (and a selector query) on every frame once you scroll past the hero.
  // The pixel room replaces these hidden layers; it must not pay for the old orb's ticker.
  if (legacyHero) {
  let mx=0, my=0, ox=0, oy=0;
  const heroOrbEl = document.querySelector('.hero-orb');
  const heroSceneEl = document.querySelector('.scene-hero');
  let heroInView = true;
  if (heroSceneEl && 'IntersectionObserver' in window) {
    new IntersectionObserver(es => { heroInView = es[0].isIntersecting; }, { threshold: 0 }).observe(heroSceneEl);
  }
  window.addEventListener('mousemove', e => {
    mx = (e.clientX / innerWidth - 0.5) * 70;
    my = (e.clientY / innerHeight - 0.5) * 50;
  }, { passive: true });
  gsap.ticker.add(() => {
    if (!heroInView || !heroOrbEl) return;
    ox += (mx - ox) * 0.04;
    oy += (my - oy) * 0.04;
    gsap.set(heroOrbEl, { x: ox, y: oy });
  });
  }

  // --- Section title character sweep ---
  // Chars are grouped into word-level spans (white-space:nowrap) so the
  // inline-block character spans never break mid-word when the column is narrow.
  document.querySelectorAll('[data-split-reveal]').forEach(el => {
    const tokens = el.textContent.trim().split(/(\s+)/);
    el.innerHTML = '';
    const allChs = [];
    tokens.forEach(token => {
      if (/^\s+$/.test(token)) {
        const sp = document.createElement('span');
        sp.style.cssText = 'display:inline-block;width:.28em;';
        sp.textContent = '\u00A0';
        el.appendChild(sp);
      } else {
        const wSpan = document.createElement('span');
        wSpan.style.cssText = 'display:inline-block;white-space:nowrap;';
        [...token].forEach(ch => {
          const s = document.createElement('span');
          s.className = 'ch';
          s.style.cssText = 'display:inline-block;clip-path:inset(0 0 100% 0);will-change:clip-path;';
          s.textContent = ch;
          wSpan.appendChild(s);
          allChs.push(s);
        });
        el.appendChild(wSpan);
      }
    });
    gsap.to(allChs, {
      clipPath: 'inset(0 0 0% 0)',
      duration: 0.75, stagger: 0.022, ease: 'expo.out',
      scrollTrigger: { trigger: el, start: 'top 88%' },
    });
  });


  // --- About reveals: handled in CSS, keyed to .about-overlay.is-open (The Set's
  //     entrance). No GSAP here so the two systems never fight. ---

  // --- s0mped: the violet world assembles ---
  // Both seams around this section were hard cuts: Capabilities ended on a 1px border and
  // s0mped began, then s0mped ended and Contact began. Now the boundary edge draws across
  // (carrying the blue-to-violet hue shift), the atmosphere comes up behind it, and the
  // editorial column lands before the story card. Nothing is hidden at rest: --edge
  // defaults to 1 in CSS and these are gsap.from() tweens, so with no JS the section is
  // simply drawn.
  (function () {
    const sec = document.querySelector('.gem-section');
    if (!sec) return;
    sec.style.setProperty('--edge', '0');
    const edge = { v: 0 };
    const tl = gsap.timeline({ scrollTrigger: { trigger: sec, start: 'top 80%', once: true } });
    tl.to(edge, {
      v: 1, duration: 1.0, ease: 'expo.out',
      onUpdate: () => sec.style.setProperty('--edge', String(edge.v)),
    })
      .from(['.gem-bg-glow', '.gem-iridescence'], { opacity: 0, duration: 1.3, ease: 'power2.out' }, 0.1)
      .from('.gem-p', { opacity: 0, scale: 0.4, duration: 0.9, ease: 'expo.out',
                        stagger: { each: 0.05, from: 'random' } }, 0.25)
      ;
    // The beats (intro, cuts, hand-set work, story card) belong to the gem chapter in
    // GemStory.jsx, which writes their opacity from the scroll. Tweening them here too
    // would make two systems fight over the same elements.
  })();

  // --- s0mped -> Contact: the quiet landing ---
  // Deliberately not a showpiece. The deal-out into Capabilities is the page's one big
  // seam moment and a second one here would compete with it, so the gem particles simply
  // drift down and dim as the section leaves, handing off to the Aurora rising underneath.
  (function () {
    const gems = document.querySelector('.gem-section');
    if (!gems || !document.querySelector('.gem-p')) return;
    gsap.to('.gem-p', {
      yPercent: 160, opacity: 0, ease: 'none',
      stagger: { each: 0.03, from: 'start' },
      scrollTrigger: { trigger: gems, start: 'bottom 85%', end: 'bottom 25%', scrub: 1 },
    });
  })();

  // The marquee keeps one speed (styles.css). It used to race with the scroll's speed (Lucy, 2026-10-25: "i dont like
  // how it moves faster on scroll"), and every change of its duration made the running strip jump.


  // --- Magnetic hover ---
  if (!reduceMotion) {
    document.querySelectorAll('.btn, .nav-logo, .contact-email, .nav-link').forEach(el => {
      el.addEventListener('mousemove', e => {
        const r = el.getBoundingClientRect();
        gsap.to(el, {
          x: (e.clientX - (r.left + r.width/2)) * 0.3,
          y: (e.clientY - (r.top  + r.height/2)) * 0.3,
          duration: 0.4, ease: 'power2.out',
        });
      });
      el.addEventListener('mouseleave', () => {
        gsap.to(el, { x: 0, y: 0, duration: 0.6, ease: 'expo.out' });
      });
    });
  }

  // --- Haptic feedback (mobile vibration) ---
  function haptic(ms) { if (navigator.vibrate) navigator.vibrate(ms || 8); }

  // (The skill cards' 3D hover tilt was removed with the bento. The span's nodes are text
  // on an axis, not surfaces, so the hover affordance is the marker lighting to the accent
  // — see .span-node:hover .span-marker.)

  // --- Ripple click effect + haptic ---
  function spawnRipple(el, e) {
    const r = el.getBoundingClientRect();
    const dot = document.createElement('span');
    dot.className = 'ripple-circle';
    dot.style.left = (e.clientX - r.left - 32) + 'px';
    dot.style.top  = (e.clientY - r.top  - 32) + 'px';
    el.appendChild(dot);
    dot.addEventListener('animationend', () => dot.remove());
  }
  document.addEventListener('click', e => {
    const btn = e.target.closest('.btn');
    if (btn) { spawnRipple(btn, e); haptic(10); }
  }, { passive: true });

  // --- Console Easter egg: a note for the curious ---
  console.log(
    '%clucy liu',
    'font-size:30px;font-family:Georgia,serif;font-style:italic;color:#A0C8FF;line-height:1.8'
  );
  console.log(
    '%cproduct designer  ·  nyu ima  ·  available summer 2027',
    'font-family:monospace;font-size:11px;letter-spacing:0.12em;color:rgba(160,200,255,0.45)'
  );
  console.log(
    '%cinspecting the markup. write me: wl3512@nyu.edu',
    'font-family:monospace;font-size:12px;color:#72ADFF;letter-spacing:0.06em'
  );
}

// Gem story: progress bar animates when card scrolls into view
(function() {
  const card = document.querySelector('[data-gem-story]');
  if (!card) return;
  const bar = card.querySelector('.gem-bar-active');
  if (!bar) return;
  const observer = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) {
      bar.classList.add('is-playing');
      observer.disconnect();
    }
  }, { threshold: 0.5 });
  observer.observe(card);
})();

// Gem story: cursor spotlight — clears photo around cursor on hover
(function() {
  const card = document.querySelector('[data-gem-story]');
  if (!card) return;
  const reveal = card.querySelector('.gem-photo-reveal');
  if (!reveal) return;
  card.addEventListener('mousemove', function(e) {
    const r = card.getBoundingClientRect();
    const cx = ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%';
    const cy = ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%';
    const grad = 'radial-gradient(circle 80px at ' + cx + ' ' + cy + ', black 20%, transparent 100%)';
    reveal.style.webkitMaskImage = grad;
    reveal.style.maskImage = grad;
  });
  card.addEventListener('mouseleave', function() {
    reveal.style.webkitMaskImage = '';
    reveal.style.maskImage = '';
  });
})();


// ── Hero canvas: A (living particles) + C (cursor blooms) ──────
function initHeroCanvas() {
  const canvas = document.getElementById('hero-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const hero = document.querySelector('.scene-hero');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    canvas.width  = hero.offsetWidth;
    canvas.height = hero.offsetHeight;
  }
  resize();
  new ResizeObserver(resize).observe(hero);

  // ── A: Drifting micro-particles (floaters) — disabled; FaultyTerminal is the hero bg texture ──
  const N = 0;
  const pts = Array.from({ length: N }, () => ({
    x:   Math.random(),
    y:   Math.random(),
    sz:  0.7 + Math.random() * 2,
    op:  0.07 + Math.random() * 0.25,
    spd: 0.00007 + Math.random() * 0.00018,
    ang: Math.random() * Math.PI * 2,
    ph:  Math.random() * Math.PI * 2,
    fr:  0.28 + Math.random() * 0.55,
    vx:  0, vy: 0,
    lav: Math.random() < 0.25,
  }));

  // ── C: Cursor bloom stamps ──
  const blooms = [];
  let cx = -1, cy = -1, lbx = -1, lby = -1;

  hero.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    cx = e.clientX - r.left;
    cy = e.clientY - r.top;
    const dx = cx - lbx, dy = cy - lby;
    if (dx * dx + dy * dy > 40) {
      blooms.push({ x: cx, y: cy, op: 0.10 + Math.random() * 0.07, r: 44 + Math.random() * 38 });
      lbx = cx; lby = cy;
      wake();
    }
  }, { passive: true });
  hero.addEventListener('mouseleave', () => { cx = -1; cy = -1; });

  /* One loop, and only while there is something to draw. With the particles (A) off, the
     canvas is empty unless the cursor is leaving blooms, but this used to run twice (tick()
     at start and again from the observer's first callback, and once more on every quick
     re-entry) and clear a hero-sized canvas every frame with nothing on it. It now wakes
     on a new bloom, sleeps a frame after the last one fades, and pauses off screen. */
  let t = 0, raf = 0, visible = true;
  const busy = () => pts.length > 0 || blooms.length > 0;
  function wake() { if (!raf && visible && busy()) raf = requestAnimationFrame(tick); }
  function tick() {
    raf = 0;
    if (!visible) return;
    const had = busy();
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // Blooms
    for (let i = blooms.length - 1; i >= 0; i--) {
      const b = blooms[i];
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0,    `rgba(160,200,255,${b.op.toFixed(3)})`);
      g.addColorStop(0.42, `rgba(160,200,255,${(b.op * 0.28).toFixed(3)})`);
      g.addColorStop(1,    'rgba(160,200,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      b.op *= 0.925; b.r *= 1.014;
      if (b.op < 0.004) blooms.splice(i, 1);
    }

    // Particles
    pts.forEach(p => {
      if (!reduced) {
        // Two-frequency noise
        const nx = Math.sin(p.x * 4.3 + t * p.fr + p.ph) * 0.5
                 + Math.sin(p.y * 3.2 + t * p.fr * 1.4) * 0.5;
        const ny = Math.cos(p.y * 3.9 + t * p.fr + p.ph) * 0.5
                 + Math.cos(p.x * 4.6 + t * p.fr * 0.85) * 0.5;
        p.vx += nx * 0.00042;
        p.vy += ny * 0.00042;

        // Cursor repulsion
        if (cx >= 0) {
          const px = p.x * W, py = p.y * H;
          const ddx = px - cx, ddy = py - cy;
          const d2 = ddx * ddx + ddy * ddy;
          const R = 115;
          if (d2 < R * R && d2 > 0.01) {
            const d = Math.sqrt(d2);
            const f = ((R - d) / R) * 0.0065;
            p.vx += (ddx / d) * f;
            p.vy += (ddy / d) * f;
          }
        }

        p.vx *= 0.965; p.vy *= 0.965;
        p.x += p.vx + Math.cos(p.ang) * p.spd;
        p.y += p.vy + Math.sin(p.ang) * p.spd;
        p.ang += 0.0018;

        if (p.x < -0.02) p.x = 1.02; else if (p.x > 1.02) p.x = -0.02;
        if (p.y < -0.02) p.y = 1.02; else if (p.y > 1.02) p.y = -0.02;
      }

      const col = p.lav ? '196,176,255' : '160,200,255';
      const op  = reduced ? p.op * 0.35 : p.op;
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.sz, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${col},${op.toFixed(3)})`;
      ctx.fill();
    });

    t += 0.0038;
    // Keep going while anything is left; the frame after the last bloom clears it away.
    if (busy() || had) raf = requestAnimationFrame(tick);
  }

  wake();
  new IntersectionObserver(entries => {
    visible = entries[0].isIntersecting;
    if (visible) wake();
    else if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }, { threshold: 0.01 }).observe(hero);
}

function initFallback() {
  gsap.set(['.hero-heading .char'], { clearProps: 'all' });
  document.querySelectorAll('[data-split-reveal] .ch').forEach(el => { el.style.clipPath = 'none'; });
}
