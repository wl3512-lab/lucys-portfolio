/* ── LOADER ── */
#ll-loader {
  position: fixed; inset: 0; z-index: 9999;
  overflow: hidden; pointer-events: all;
  background: #050710;
}
#ll-loader.ll-gone { display: none; }

/* ── Intentional handoff: the loader doesn't get torn away, it BECOMES the site. ──
   Choreography (≈1s, all exponential ease-out):
     1. HUD + progress rail retire downward (their report is done)
     2. margin code dissolves; corner brackets push outward (the frame opens)
     3. the globe scales past the camera (you pass through it into the archive)
     4. the "lucy liu" wordmark FLIP-travels into the nav logo (JS sets --ll-tx/ty/sc)
     5. the black backdrop lifts, revealing the hero already rising underneath */
#ll-loader.ll-handoff { pointer-events: none; }
#ll-loader.ll-handoff .ll-hud,
#ll-loader.ll-handoff .ll-bar {
  opacity: 0; transform: translateY(18px);
  transition: opacity 0.32s cubic-bezier(0.22,1,0.36,1), transform 0.32s cubic-bezier(0.22,1,0.36,1);
}
#ll-loader.ll-handoff .ll-code { opacity: 0; transition: opacity 0.28s ease-out; }
#ll-loader.ll-handoff .ll-fr { opacity: 0; transition: opacity 0.5s ease-out 0.1s, transform 0.5s cubic-bezier(0.22,1,0.36,1) 0.1s; }
#ll-loader.ll-handoff .ll-fr-tl { transform: translate(-30px,-30px); }
#ll-loader.ll-handoff .ll-fr-tr { transform: translate(30px,-30px); }
#ll-loader.ll-handoff .ll-fr-bl { transform: translate(-30px,30px); }
#ll-loader.ll-handoff .ll-fr-br { transform: translate(30px,30px); }
#ll-loader.ll-handoff #ll-three {
  opacity: 0; transform: scale(1.5);
  transition: opacity 0.6s ease-out 0.08s, transform 0.75s cubic-bezier(0.22,1,0.36,1);
}
/* backdrop lifts after the furniture retires, revealing the hero mid-entrance */
#ll-loader { transition: background-color 0.45s ease-out; }
#ll-loader.ll-handoff.ll-lift { background-color: transparent; }
/* wordmark FLIP: JS measures the nav logo and fills the custom props */
#ll-loader.ll-handoff .ll-rm-inner { background: none; }
#ll-loader.ll-handoff .ll-rm-sub { opacity: 0; transition: opacity 0.25s ease-out; }
#ll-loader.ll-handoff .ll-rm-name {
  transform: translate(var(--ll-tx, 0px), var(--ll-ty, -38vh)) scale(var(--ll-sc, 0.3));
  opacity: var(--ll-fade, 0);
  transition: transform 0.78s cubic-bezier(0.22,1,0.36,1) 0.12s, opacity 0.3s ease-out 0.72s;
  transform-origin: top left;
}
@media (prefers-reduced-motion: reduce) {
  #ll-loader.ll-handoff, #ll-loader.ll-handoff * { transition: none !important; }
  #ll-loader.ll-handoff { opacity: 0; }
}

/* Boot HUD — big count-up, status line, and a progress rail (decoding-terminal loader). */
.ll-hud {
  position: absolute; left: 0; right: 0; bottom: clamp(26px, 6vh, 54px); z-index: 4;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 clamp(20px, 5vw, 56px); font-family: var(--font-code);
  transition: opacity 0.3s ease;
}
.ll-hud-status { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg3); }
.ll-hud-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent, #72ADFF); box-shadow: 0 0 8px var(--accent, #72ADFF); animation: llHudPulse 1.1s ease-in-out infinite; }
.ll-hud-count { display: flex; align-items: flex-end; gap: 3px; color: var(--fg1); line-height: 0.78; }
.ll-pct { font-family: var(--font-code); font-weight: 700; font-size: clamp(56px, 12vw, 142px); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.ll-pct-sym { font-size: clamp(16px, 3vw, 30px); color: var(--accent, #72ADFF); margin-bottom: 0.45em; }
.ll-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(160, 200, 255, 0.12); z-index: 4; transition: opacity 0.3s ease; }
.ll-bar-fill { display: block; height: 100%; width: 0%; background: var(--accent, #72ADFF); box-shadow: 0 0 10px var(--accent, #72ADFF); transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes llHudPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
#ll-loader.is-done .ll-hud, #ll-loader.is-done .ll-bar { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .ll-hud-dot { animation: none; } }

/* LetterGlitch boot backdrop — a decoding letter grid (React Bits, canvas 2D) behind the
   wordmark. Its own center/outer vignettes keep the name legible and fade the edges into
   void; fades out on exit. Canvas 2D (no WebGL), so it runs on mobile too. */
#ll-glitch {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  opacity: 0.5;
  transition: opacity 0.55s ease;
}
#ll-glitch canvas { display: block; width: 100%; height: 100%; }
#ll-loader.is-done #ll-glitch { opacity: 0; }
@media (prefers-reduced-motion: reduce) { #ll-glitch { display: none; } }

/* ASCIIText loader name — replaces #ll-ascii once it mounts (.has-asciitext). */
#ll-asciitext { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
#ll-asciitext canvas {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  image-rendering: pixelated;
}
#ll-asciitext pre {
  background-image: linear-gradient(135deg, #A0C8FF 0%, #C4B0FF 55%, #72ADFF 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
#ll-loader.has-asciitext #ll-ascii,
#ll-loader.has-asciitext #ll-svg { display: none !important; }
#ll-loader.is-done #ll-asciitext { opacity: 0; transition: opacity 0.4s ease; }
@media (prefers-reduced-motion: reduce) { #ll-asciitext { display: none; } }

/* WebGL noise-dissolve canvas — pixels become transparent as the fBm threshold sweeps */
#ll-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  z-index: 1;
}

/* Hard fallback: if JS animations fail, hero content is still visible */
body.loader-done .hero-orb,
body.loader-done .hero-heading .char {
  opacity: 1 !important;
  transform: none !important;
}

/* s0mped wordmark */
.gem-wordmark {
  display: block;
  width: clamp(140px, 17vw, 196px);
  height: auto;
  margin: 10px 0 22px;
  filter: brightness(0) invert(1);
  opacity: 0.72;
  transition: opacity 0.25s ease;
}
@media (prefers-reduced-motion: no-preference) {
  .gem-wordmark { will-change: opacity; }
}

#ll-loader.is-done { pointer-events: none; }

/* Constellation SVG */
#ll-svg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  overflow: visible; pointer-events: none;
  transition: opacity 0.18s ease;
  z-index: 2;
}
/* #ll-svg opacity on exit is controlled by bloomStars() JS, not CSS */

/* Name block */
#ll-name {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
  pointer-events: none;
  transition: opacity 0.18s ease;
}
#ll-loader.is-done #ll-name { opacity: 0; }

#ll-name-word {
  font-family: 'Syne', system-ui, sans-serif;
  font-style: italic; font-weight: 400;
  font-size: clamp(48px, 9vw, 96px);
  letter-spacing: -0.04em; line-height: 1;
  color: #F6FAFF;
  display: flex; align-items: baseline;
}
.ll-c {
  display: inline-block;
  opacity: 0;
  transform: translateY(var(--from-y, -30px));
  will-change: transform, opacity;
}
.ll-c.is-in {
  opacity: 1;
  transform: translateY(0);
  transition:
    opacity 0.42s cubic-bezier(0.22,1,0.36,1),
    transform 0.52s cubic-bezier(0.22,1,0.36,1);
}
.ll-sp { width: 0.32em; }

#ll-name-sub {
  font-family: 'Space Mono', monospace;
  font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase;
  color: rgba(160,200,255,0.32);
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
#ll-name-sub.is-in { opacity: 1; transform: translateY(0); }

@keyframes ll-twinkle {
  0%, 100% { opacity: var(--tw-hi, 1); }
  50%       { opacity: var(--tw-lo, 0.3); }
}

/* Reduced-motion fallback */
/* The loader name: a gradient "lucy liu" wordmark over the LetterGlitch grid. Shown on
   every load now (not just reduced-motion). The hidden #ll-ascii ticker still drives the
   exit timing; this just replaces what's visible. */
.ll-rm-inner {
  display: flex; position: absolute; inset: 0; z-index: 5;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
  /* Dark scrim so the wordmark + subtitle read clearly over the glitch grid. */
  background: radial-gradient(ellipse 58% 40% at 50% 50%,
    rgba(5,7,16,0.92) 0%, rgba(5,7,16,0.6) 42%, rgba(5,7,16,0) 72%);
}
/* animation:none is required — the entrance animation's `both` fill otherwise pins
   opacity:1 and overrides this fade, leaving the name stuck over the hero during the
   ~2.4s exit dissolve. */
/* GUARD (keep animation:none + final opacity 0): the delay lets the wordmark finish its
   FLIP into the nav logo before fading; it still always ends hidden. */
#ll-loader.is-done .ll-rm-inner { animation: none; opacity: 0; transition: opacity 0.3s ease 0.72s; }
@media (prefers-reduced-motion: reduce) { #ll-loader.is-done .ll-rm-inner { transition: none; } }
@media (prefers-reduced-motion: no-preference) {
  .ll-rm-inner { animation: llRmIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
}
@keyframes llRmIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
/* Small gradient accent rule above the wordmark. */
.ll-rm-inner::before {
  content: ''; width: 46px; height: 2px; border-radius: 2px; margin-bottom: 6px;
  background: linear-gradient(90deg, transparent, #72ADFF, transparent);
  opacity: 0.85;
}
.ll-rm-name {
  font-family: 'Syne', system-ui, sans-serif; font-style: italic; font-weight: 600;
  font-size: clamp(52px, 8.5vw, 104px); letter-spacing: -0.045em; line-height: 1.04;
  /* padding gives the gradient box room for the italic overhang (background-clip:text
     paints only within the box, so without it the slanted final glyph is cut off). */
  padding: 0.04em 0.22em;
  background: linear-gradient(116deg, #F6FAFF 0%, #E8E0FF 30%, #A0C8FF 62%, #72ADFF 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 0 24px rgba(114, 173, 255, 0.38));
}
.ll-rm-sub {
  font-family: 'Space Mono', monospace; font-size: 11px;
  letter-spacing: 0.34em; text-transform: uppercase; color: rgba(200, 222, 255, 0.85);
  padding-left: 0.34em; /* optical balance for the wide tracking */
}

/* ── ASCII wordmark (retired as the visible name; kept hidden so its resolve ticker
   still drives the loader exit timing — the gradient .ll-rm-name shows instead) ── */
#ll-ascii {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 0;
  pointer-events: none;
  z-index: 3;
}
#ll-ascii::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 62vw 46vh at 50% 50%, rgba(114,173,255,0.14) 0%, transparent 64%);
  opacity: 0; transition: opacity 0.75s ease;
  pointer-events: none; z-index: 0;
}
#ll-ascii.aura-on::before { opacity: 1; }
#ll-ascii-line1,
#ll-ascii-line2 {
  font-family: 'Space Mono', 'Courier New', monospace;
  font-size: clamp(16px, 3vw, 32px);
  line-height: 1.32;
  letter-spacing: 0.01em;
  margin: 0; padding: 0;
  white-space: pre;
  user-select: none;
  position: relative; z-index: 1;
}
#ll-ascii-line2 { margin-top: 0.85em; }
.asc-cell { display: inline; }
.asc-noise { color: rgba(114,173,255,0.12); }
.asc-scan  { color: rgba(233,247,255,0.96); }
.asc-fill  {
  color: rgba(114,173,255,0.95);
  text-shadow: 0 0 8px rgba(114,173,255,0.88), 0 0 28px rgba(114,173,255,0.30);
}
.asc-void  { color: rgba(114,173,255,0.05); }
#ll-loader.is-done .asc-fill {
  animation: asc-exit-flash 0.28s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes asc-exit-flash {

  100% { color: rgba(114,173,255,0.95); text-shadow: 0 0 8px rgba(114,173,255,0.88), 0 0 28px rgba(114,173,255,0.30); }
}
@media (prefers-reduced-motion: reduce) { #ll-loader.is-done .asc-fill { animation: none; } }
#ll-ascii-sub {
  font-family: 'Space Mono', monospace;
  font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase;
  color: rgba(160,200,255,0.32);
  opacity: 0; transform: translateY(6px);

}
#ll-ascii-sub.is-in { opacity: 1; transform: translateY(0); }
#ll-loader.is-done #ll-ascii { opacity: 0; transition: opacity 0.22s ease; }

@media (prefers-reduced-motion: reduce) {
  #ll-svg, #ll-name, #ll-ascii { display: none; }

/* Faint scrambling code columns in the margins (decoding texture) */

(function () {
  var loader = document.getElementById('ll-loader');
  if (!loader) return;

  var barEl   = document.querySelector('.ll-bar-fill');

  /* ── Exit: curtain wipe-up, with hard guards ── */
  function exitLoader() {
    if (loader.classList.contains('is-done')) return;
    loader.classList.add('is-done');
    window.__loaderExited = true;
    document.body.classList.add('loader-done');           /* GUARD: hero visible regardless */
    try { window.dispatchEvent(new CustomEvent('loader:exit')); } catch (e) {}
    if (codeTimer) { clearInterval(codeTimer); codeTimer = null; }
    var done = false;
    var finish = function () {
      if (done) return; done = true;
      loader.classList.add('ll-gone');
      document.body.style.overflow = '';
      if (three && three.stop) { try { three.stop(); } catch (e) {} }
    };
    var fallbackTimer = setTimeout(finish, 1700);          /* GUARD: never strand the page */
    if (rm) { clearTimeout(fallbackTimer); setTimeout(finish, 220); return; }
    /* FLIP: measure where the nav logo sits and send the wordmark there, so the name
       you watched during boot literally becomes the persistent brand mark. */
    try {
      var name = loader.querySelector('.ll-rm-name');
      var target = document.querySelector('.flow-menu-logo-text');
      if (name && target) {
        var a = name.getBoundingClientRect();
        var b = target.getBoundingClientRect();
        if (b.width > 0 && b.height > 0) {
          loader.style.setProperty('--ll-tx', (b.left - a.left).toFixed(1) + 'px');
          loader.style.setProperty('--ll-ty', (b.top - a.top).toFixed(1) + 'px');
          loader.style.setProperty('--ll-sc', (b.height / Math.max(a.height, 1)).toFixed(4));
        }
      }
    } catch (e) {}   /* no target = CSS fallback: wordmark drifts up and fades */
    loader.classList.add('ll-handoff');
    setTimeout(function () { loader.classList.add('ll-lift'); }, 300);
    setTimeout(function () { clearTimeout(fallbackTimer); finish(); }, 1080);
  }

  /* ── Scrambling decode columns in the margins ── */
  var GLY = '0123456789ABCDEF/<>[]{}=+*·:.';
  function scrambleCol(el, rows, cols) {
    if (!el) return;
    var out = '';
    for (var r = 0; r < rows; r++) {
      var line = '';
      for (var c = 0; c < cols; c++) {
        line += (Math.random() < 0.38) ? GLY[(Math.random() * GLY.length) | 0] : ' ';
      }
      out += line + '\n';
    }
    el.textContent = out;
  }
  if (!rm) {
    scrambleCol(codeL, 16, 11); scrambleCol(codeR, 16, 11);
    /* 150ms (was 90ms): full-grid re-randomization at 90ms read as high-frequency static
       and made the whole boot sequence feel jittery next to the globe/counter/cursor all
       animating at once. Slower + thinner (see scrambleCol density above) keeps the
       "decoding" texture without competing for attention. */
    codeTimer = setInterval(function () { scrambleCol(codeL, 16, 11); scrambleCol(codeR, 16, 11); }, 150);
  }

  /* ── Paced boot counter (drives the reveal) ── */
  var cStart = null, CDUR = rm ? 500 : (fast ? 380 : 2600);
  function runCounter(ts) {
    if (!cStart) cStart = ts;
    var p = Math.min((ts - cStart) / CDUR, 1);
    var val = Math.floor((1 - Math.pow(1 - p, 3)) * 100);
    if (val > shownPct) { shownPct = val; if (pctEl) pctEl.textContent = val; if (barEl) barEl.style.width = val + '%'; }
    if (p < 1) { requestAnimationFrame(runCounter); }
    else {
      if (pctEl) pctEl.textContent = '100';
      if (barEl) barEl.style.width = '100%';
      if (bootMsg) bootMsg.textContent = 'archive ready';
      setTimeout(exitLoader, 460);
    }
  }
  requestAnimationFrame(runCounter);

  /* Safety bail — never let the loader hang */
  setTimeout(function () { if (!loader.classList.contains('is-done')) exitLoader(); }, 6500);

  /* ── 3D wireframe globe behind the HUD (Three.js loads defer, so poll for it) ── */
  if (!rm && !fast) {
    var triesT = 0;
    (function waitThree() {
      if (window.THREE) { try { initThree(window.THREE); } catch (e) {} return; }
      /* Capped at ~1.5s (not the old ~3.5s): if it hasn't arrived by then, showing it a
         beat later — often right as the loader is already exiting — reads as a jarring
         flash-then-fade rather than a nice reveal, so we just skip it that run. */
      if (triesT++ > 30) return;
      setTimeout(waitThree, 50);
    })();
  }
  function initThree(THREE) {
    var canvas = document.getElementById('ll-three'); if (!canvas) return;
    var renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' }); }
    catch (e) { return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    var w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false);
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(55, w / h, 0.1, 100); camera.position.z = 10;
    var geo = new THREE.IcosahedronGeometry((w < 768 ? 3.4 : 4.4), 2);
    var wire = new THREE.WireframeGeometry(geo);
    var mat = new THREE.LineBasicMaterial({ color: new THREE.Color('#72ADFF'), transparent: true, opacity: 0.4 });
    var mesh = new THREE.LineSegments(wire, mat); scene.add(mesh);
    var pmat = new THREE.PointsMaterial({ color: new THREE.Color('#C4B0FF'), size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.7 });
    var pts = new THREE.Points(geo, pmat); scene.add(pts);
    var my = 0; function onMove(e) { my = (e.clientY / window.innerHeight - 0.5); }
    window.addEventListener('mousemove', onMove, { passive: true });
    function onResize() { var a = window.innerWidth, b = window.innerHeight; camera.aspect = a / b; camera.updateProjectionMatrix(); renderer.setSize(a, b, false); }
    window.addEventListener('resize', onResize);
    var raf = null, running = true;
    function frame() {
      if (!running) return;
      mesh.rotation.y += 0.003; mesh.rotation.x += (my * 0.4 - mesh.rotation.x) * 0.05;
      pts.rotation.x = mesh.rotation.x; pts.rotation.y = mesh.rotation.y;
      renderer.render(scene, camera); raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    canvas.classList.add('is-ready');   /* CSS eases opacity 0→1; no more hard pop-in */
    three = {
      stop: function () {
        running = false; if (raf) cancelAnimationFrame(raf);
        window.removeEventListener('mousemove', onMove); window.removeEventListener('resize', onResize);
        try { geo.dispose(); wire.dispose(); mat.dispose(); pmat.dispose(); renderer.dispose(); } catch (e) {}
      }
    };
  }
})();
</script>

        // Covers (and other code-owned display fields) come from DEFAULT_PROJECTS, never

        // paths after the source covers change. Cache still supplies any other fields.

function applyTweaks(t) {
  const root = document.documentElement;
  const accents = {
    blue:     { c1: '#72ADFF', c2: '#A0C8FF', c3: '#C4B0FF' },
    lavender: { c1: '#C4B0FF', c2: '#E8E0FF', c3: '#A0C8FF' },
    warm:     { c1: '#F5C0A0', c2: '#F0A8A8', c3: '#E8B4C0' },
    mono:     { c1: '#E2EEFF', c2: '#A0C8FF', c3: '#72ADFF' },
  };
  const a = accents[t.accentColor] || accents.blue;
  root.style.setProperty('--accent',       a.c1);
  root.style.setProperty('--fg-accent',    a.c1);
  root.style.setProperty('--fg-accent-dim',a.c2);

  if (t.reduceMotion) root.classList.add('reduce-motion'); else root.classList.remove('reduce-motion');
}

function TweaksPanel({ tweaks, setTweaks, open, onClose }) {
  const set = (k, v) => {
    const next = { ...tweaks, [k]: v };

    window.parent?.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');

  return (

}

    return () => window.removeEventListener('hashchange', sync);

  useEffect(() => {
    if (aboutOpen) { try { window.__lenis?.stop(); } catch (e) {} }

    // Desktop pointers only; skipped entirely for reduced motion.
    let lampRaf = null, onLampMove = null;

    const fine = window.matchMedia('(pointer: fine)').matches;

        x += (tx - x) * 0.09; y += (ty - y) * 0.09;
        lamp.style.transform = 'translate(' + x + 'px,' + y + 'px)';
        lampRaf = requestAnimationFrame(loop);

      lampRaf = requestAnimationFrame(loop);

    return () => {
      window.removeEventListener('keydown', onKey);
      if (onLampMove) window.removeEventListener('mousemove', onLampMove);

    if (location.hash === '#about') history.replaceState(null, '', location.pathname + location.search);

  // Smooth scroll anchor clicks; #about opens the menu-only About view instead.
  const onNavClick = (e) => {

    e.preventDefault();
    if (href === '#about') { location.hash = 'about'; return; }
    const target = document.querySelector(href);
    if (target && window.__lenis) window.__lenis.scrollTo(target, { offset: -80 });
    else target?.scrollIntoView({ behavior: 'smooth' });
  };

  const onOpenProject = (p) => {
    try { localStorage.setItem('lucy.projects', JSON.stringify(projects)); } catch {}
  };

  // Show the Waves backdrop only while the Spotlight zone is on screen.
  useEffect(() => {
    const el = waveZoneRef.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => setWavesActive(entries[0].isIntersecting),
      { threshold: 0, rootMargin: '0px 0px -25% 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);

  const wavesEnabled = typeof Waves !== 'undefined' && window.innerWidth >= 760 &&
    !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  return (
    <>
      {typeof TargetCursor !== 'undefined'
        ? <TargetCursor targetSelector="a, button, [role='button'], .cursor-target" spinDuration={3} hoverDuration={0.18} />
        : <Cursor />}
      <Nav onNavClick={onNavClick} />
      {/* Viewport-fixed Waves backdrop, shown only while the Spotlight zone is in view
          (IntersectionObserver). Fades out as the Capabilities header arrives. */}
      {wavesEnabled && (
        <Waves
          className={'zone-waves' + (wavesActive ? ' is-active' : '')}
          lineColor="#169eff"
          waveSpeedX={0.015}
          waveSpeedY={0.008}
          waveAmpX={34}
          waveAmpY={18}
          xGap={14}
          yGap={36}
          friction={0.92}
          tension={0.008}
          maxCursorMove={40}
        />
      )}
      <main id="main-content" tabIndex="-1">
        <Hero />
        <Marquee />
        <div className="wave-zone" ref={waveZoneRef}>
          <Spotlight projects={projects} onOpen={onOpenProject} />
        </div>
        <SkillsSection />
        <GemStory />
        <ContactSection />
      </main>
      <div
        className={'about-overlay' + (aboutOpen ? ' is-open' : '')}
        role="dialog"
        aria-modal="true"
        aria-label="About Lucy Liu"
        aria-hidden={!aboutOpen}
        onClick={(e) => { if (e.target === e.currentTarget) closeAbout(); }}
      >
        <button type="button" className="about-overlay-close" aria-label="Close about" onClick={closeAbout}>
          <span aria-hidden="true">✕</span>
        </button>
        {/* The Reading Light: a soft archival lamp that follows the cursor through the
            overlay (desktop pointer only; driven from the aboutOpen effect). */}
        <div className="about-lamp" aria-hidden="true" />
        {/* data-lenis-prevent: Lenis is stopped while the overlay is open and a stopped
            Lenis swallows wheel events window-wide; this opts the overlay's native
            scroller out so it keeps scrolling. */}
        <div className="about-overlay-scroll" data-lenis-prevent="true">
          <AboutSection />
        </div>
      </div>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} open={tweaksOpen} onClose={() => setTweaksOpen(false)} />
    </>
  );
}

// GSAP + LENIS: animation system
// ============================================================
// Wait for React to mount (Babel fetches JSX async; 'load' fires too early on Vercel)
(function() {
  let fired = false;
  function go() { if (!fired) { fired = true; initAnimations(); } }
  window.addEventListener('app:ready', go);
  // Fallback: if app:ready never fires (e.g. React error), still run after 4s
  window.addEventListener('load', () => setTimeout(go, 4000));
})();

function initAnimations() {
  if (!window.gsap || !window.ScrollTrigger) return;
  gsap.registerPlugin(ScrollTrigger);
  initHeroCanvas();

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
    || document.documentElement.classList.contains('reduce-motion');

  // --- Lenis smooth scroll ---
  if (window.Lenis && !reduceMotion) {
    const lenis = new Lenis({
      duration: 1.15,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      wheelMultiplier: 0.9,
    });
    window.__lenis = lenis;
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);
  }

  // --- Scroll progress bar ---
  gsap.to('.scroll-progress', {
    scaleX: 1, ease: 'none',
    scrollTrigger: { trigger: document.body, start: 'top top', end: 'bottom bottom', scrub: true },
  });

  if (reduceMotion) { initFallback(); return; }

  // --- Hero: split characters (run now so DOM is ready; animation fires on loader:exit) ---
  document.querySelectorAll('.hero-heading .word').forEach(w => {
    const txt = w.textContent;
    const asciiWord = w.getAttribute('data-ascii');
    const aStart = asciiWord ? txt.indexOf(asciiWord) : -1;
    const aEnd = aStart >= 0 ? aStart + asciiWord.length : -1;
    w.textContent = '';
    [...txt].forEach((c, i) => {
      const s = document.createElement('span');
      s.className = (aStart >= 0 && i >= aStart && i < aEnd) ? 'char hero-ascii-char' : 'char';
      s.textContent = c === ' ' ? '\u00A0' : c;
      w.appendChild(s);
    });
  });
  const chars = document.querySelectorAll('.hero-heading .char');

  // Hero elements are visible by default (CSS). gsap.from() adds entrance flourish
  // without making anything invisible \u2014 if animation never fires, content stays visible.
  const heroEl = document.querySelector('.scene-hero');
  if (heroEl) heroEl.style.overflow = 'visible';

  function playHeroEntrance() {
    const tl = gsap.timeline({
      onComplete: () => { if (heroEl) heroEl.style.overflow = ''; },
    });

    tl.from('.hero-orb', { opacity: 0, scale: 0.8, duration: 0.9, ease: 'expo.out' }, 0);
    tl.from(chars, {
      yPercent: 120, skewX: 10, opacity: 0,
      duration: 1.1, stagger: { each: 0.022 }, ease: 'expo.out',
    }, 0);
    tl.from(['.hero-name-aside', '.hero-name-row--role', '.hero-lede'], {
      y: 40, opacity: 0, duration: 0.9, stagger: 0.07, ease: 'expo.out',
    }, 0.66);
  }

  if (window.__loaderExited) {
    playHeroEntrance();
  } else {
    window.addEventListener('loader:exit', playHeroEntrance, { once: true });
  }

  // --- Hero parallax layers (3 speeds) ---
  gsap.to('.hero-bg-layer', {
    y: '15%', ease: 'none',
    scrollTrigger: { trigger: '.scene-hero', start: 'top top', end: 'bottom top', scrub: true },
  });
  gsap.to('.hero-orb', {
    y: '-10%', scale: 1.1, ease: 'none',
    scrollTrigger: { trigger: '.scene-hero', start: 'top top', end: 'bottom top', scrub: 0.8 },
  });
  // --- B: Cinematic word choreography on scroll-out ---
  const [wm0, wm1, wm2] = document.querySelectorAll('.hero-heading .word-mask');
  // "Design": expands outward and dissolves (approach a giant title card)
  if (wm0) gsap.to(wm0, {
    scale: 3.0, opacity: 0, transformOrigin: 'left center',
    ease: 'power1.in',
    scrollTrigger: { trigger: '.scene-hero', start: 'top top', end: '40% top', scrub: 1.6 },
  });
  // "for the": peels left and up, compresses
  if (wm1) gsap.to(wm1, {
    x: '-10vw', y: -50, opacity: 0,
    ease: 'none',
    scrollTrigger: { trigger: '.scene-hero', start: '6% top', end: '46% top', scrub: 1.2 },
  });
  // "human mind.": holds until 80% of range, then hard editorial cut
  if (wm2) gsap.to(wm2, {
    opacity: 0,
    ease: 'steps(1)',
    scrollTrigger: { trigger: '.scene-hero', start: '24% top', end: '56% top', scrub: true },
  });
  // --- Hero mouse parallax on orb ---
  // Cache the element and gate the per-frame ticker on hero visibility so it stops
  // doing work (and a selector query) on every frame once you scroll past the hero.
  let mx=0, my=0, ox=0, oy=0;
  const heroOrbEl = document.querySelector('.hero-orb');
  const heroSceneEl = document.querySelector('.scene-hero');
  let heroInView = true;
  if (heroSceneEl && 'IntersectionObserver' in window) {
    new IntersectionObserver(es => { heroInView = es[0].isIntersecting; }, { threshold: 0 }).observe(heroSceneEl);
  }
  window.addEventListener('mousemove', e => {
    mx = (e.clientX / innerWidth - 0.5) * 70;
    my = (e.clientY / innerHeight - 0.5) * 50;
  }, { passive: true });
  gsap.ticker.add(() => {
    if (!heroInView || !heroOrbEl) return;
    ox += (mx - ox) * 0.04;
    oy += (my - oy) * 0.04;
    gsap.set(heroOrbEl, { x: ox, y: oy });
  });

  // --- Section title character sweep ---
  // Chars are grouped into word-level spans (white-space:nowrap) so the
  // inline-block character spans never break mid-word when the column is narrow.
  document.querySelectorAll('[data-split-reveal]').forEach(el => {
    const tokens = el.textContent.trim().split(/(\s+)/);
    el.innerHTML = '';
    const allChs = [];
    tokens.forEach(token => {
      if (/^\s+$/.test(token)) {
        const sp = document.createElement('span');
        sp.style.cssText = 'display:inline-block;width:.28em;';
        sp.textContent = '\u00A0';
        el.appendChild(sp);
      } else {
        const wSpan = document.createElement('span');
        wSpan.style.cssText = 'display:inline-block;white-space:nowrap;';
        [...token].forEach(ch => {
          const s = document.createElement('span');
          s.className = 'ch';
          s.style.cssText = 'display:inline-block;clip-path:inset(0 0 100% 0);will-change:clip-path;';
          s.textContent = ch;
          wSpan.appendChild(s);
          allChs.push(s);
        });
        el.appendChild(wSpan);
      }
    });
    gsap.to(allChs, {
      clipPath: 'inset(0 0 0% 0)',
      duration: 0.75, stagger: 0.022, ease: 'expo.out',
      scrollTrigger: { trigger: el, start: 'top 88%' },
    });
  });

  // --- Skills bento reveal ---
  gsap.to('.skill-card', {
    y: 0, opacity: 1, duration: 0.75, stagger: 0.08, ease: 'expo.out',
    scrollTrigger: { trigger: '.skills-grid', start: 'top 82%' },
  });

  // --- About reveals: handled in CSS, keyed to .about-overlay.is-open (the ledger
  //     choreography). No GSAP here so the two systems never fight. ---

  // --- Contact letter-spacing stretch ---
  gsap.fromTo('.contact-accent',
    { scaleX: 0.91, transformOrigin: 'center center' },
    { scaleX: 1.05, ease: 'none',
      scrollTrigger: { trigger: '.scene-contact', start: 'top 60%', end: 'center center', scrub: 2 },
    }
  );
  gsap.from(['.contact-accent','.contact-line'], {
    yPercent: 110, opacity: 0, duration: 1.1, stagger: 0.1, ease: 'expo.out',
    scrollTrigger: { trigger: '.scene-contact', start: 'top 75%' },
  });
  gsap.from('.contact-email', {
    y: 30, opacity: 0, duration: 0.9, ease: 'expo.out',
    scrollTrigger: { trigger: '.scene-contact', start: 'top 70%' },
  });

  // --- Velocity-reactive marquee ---
  const track = document.querySelector('.marquee-track');
  if (track) {
    let vel = 0, lastY = window.scrollY;
    // Only recompute the marquee speed while the strip is actually on screen.
    const marqueeEl = document.querySelector('.scene-marquee') || track;
    let marqueeInView = true;
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(es => { marqueeInView = es[0].isIntersecting; }, { threshold: 0 }).observe(marqueeEl);
    }
    gsap.ticker.add(() => {
      if (!marqueeInView) return;
      const dy = Math.abs(window.scrollY - lastY);
      vel += (dy - vel) * 0.08;
      lastY = window.scrollY;
      track.style.animationDuration = Math.max(6, 22 - vel * 0.35) + 's';
    });
  }


  // --- Magnetic hover ---
  if (!reduceMotion) {
    document.querySelectorAll('.btn, .nav-logo, .contact-email, .nav-link').forEach(el => {
      el.addEventListener('mousemove', e => {
        const r = el.getBoundingClientRect();
        gsap.to(el, {
          x: (e.clientX - (r.left + r.width/2)) * 0.3,
          y: (e.clientY - (r.top  + r.height/2)) * 0.3,
          duration: 0.4, ease: 'power2.out',
        });
      });
      el.addEventListener('mouseleave', () => {
        gsap.to(el, { x: 0, y: 0, duration: 0.6, ease: 'expo.out' });
      });
    });
  }

  // --- Haptic feedback (mobile vibration) ---
  function haptic(ms) { if (navigator.vibrate) navigator.vibrate(ms || 8); }

  // --- Skill cards: subtle 3D tilt on hover ---
  if (!reduceMotion) {
    document.querySelectorAll('.skill-card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        gsap.to(card, {
          rotateX: -y * 3, rotateY: x * 3,
          transformPerspective: 1200,
          duration: 0.4, ease: 'power2.out',
        });
      }, { passive: true });
      card.addEventListener('mouseleave', () => {
        gsap.to(card, { rotateX: 0, rotateY: 0, duration: 0.8, ease: 'expo.out' });
      });
    });
  }

  // --- Ripple click effect + haptic ---
  function spawnRipple(el, e) {
    const r = el.getBoundingClientRect();
    const dot = document.createElement('span');
    dot.className = 'ripple-circle';
    dot.style.left = (e.clientX - r.left - 32) + 'px';
    dot.style.top  = (e.clientY - r.top  - 32) + 'px';
    el.appendChild(dot);
    dot.addEventListener('animationend', () => dot.remove());
  }
  document.addEventListener('click', e => {
    const btn = e.target.closest('.btn');
    if (btn) { spawnRipple(btn, e); haptic(10); }
  }, { passive: true });

  // --- Console Easter egg: a note for the curious ---

// ── Portfolio constellation sidebar nav ──────────────────────
(function () {
  function init() {
    const nav    = document.getElementById('pf-const');
    if (!nav) return;
    const nodes  = [...document.querySelectorAll('.pf-node[data-pf]')];
    const labels = [...document.querySelectorAll('.pf-label[data-pf-label]')];
    const segs   = [...document.querySelectorAll('.pf-seg[data-seg-a]')];

    // One node per scroll section, in page order. The old map had "work" covering both
    // Spotlight and Capabilities (so it stayed lit for ~70% of the page) while the "about"
    // node never lit at all, since About is a menu overlay rather than a scroll section.
    const sectionMap = {
      hero:    document.querySelector('.scene-hero') || document.querySelector('[data-scene="hero"]'),
      work:    document.getElementById('spotlight') || document.getElementById('work'),
      skills:  document.getElementById('skills'),
      gems:    document.getElementById('gems'),
      contact: document.getElementById('contact'),
    };

    function setActive(id) {
      // stamp active section as class on nav for sub-cluster visibility
      nav.className = nav.className.replace(/\bsection-\w+/g, '').trim();
      nav.classList.add(`section-${id}`);

      nodes.forEach(g  => g.classList.toggle('is-active', g.dataset.pf === id));
      labels.forEach(l => {
        const match = l.dataset.pfLabel === id;
        l.classList.toggle('is-active',  match);
        l.classList.toggle('is-visible', match);
      });
      segs.forEach(s => {
        s.classList.toggle('is-lit', s.dataset.segA === id || s.dataset.segB === id);
      });
    }

    // Hide while hero is in view
    const heroEl = sectionMap.hero;
    if (heroEl) {
      new IntersectionObserver(entries => {
        nav.classList.toggle('is-visible', !entries[0].isIntersecting);
      }, { threshold: 0.1 }).observe(heroEl);
    }

    // Highlight active section as user scrolls
    const sectionPairs = Object.entries(sectionMap).filter(([, el]) => !!el);
    const activeObs = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const id = sectionPairs.find(([, el]) => el === entry.target)?.[0];
        if (id) setActive(id);
      });
    }, { rootMargin: '-28% 0px -62% 0px', threshold: 0 });
    sectionPairs.forEach(([, el]) => activeObs.observe(el));

    // Hover: reveal label while hovering node
    nodes.forEach(g => {
      const label = labels.find(l => l.dataset.pfLabel === g.dataset.pf);
      g.addEventListener('mouseenter', () => label?.classList.add('is-visible'));
      g.addEventListener('mouseleave', () => {
        if (!label?.classList.contains('is-active')) label?.classList.remove('is-visible');
      });
    });

    // Click / keyboard: scroll to section
    function scrollTo(id) {
      const el = sectionMap[id];
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    [...nodes, ...labels].forEach(el => {
      const id = el.dataset.pf || el.dataset.pfLabel;
      el.addEventListener('click', () => scrollTo(id));
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); scrollTo(id); }
      });
    });

    // Cluster stars → navigate to individual case studies
    const clusterSlugs = ['driftwood', 'habitabull', 'h2know', 'eternal-wreckening'];
    document.querySelectorAll('.pf-cluster[data-project]').forEach(el => {
      const slug = clusterSlugs[+el.dataset.project];
      if (!slug) return;
      const go = () => { window.location.href = `case-study.html?slug=${slug}`; };
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    });

    // Subtle scroll parallax: constellation drifts up as page scrolls
    if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
      gsap.to(nav, {
        y: -28, ease: 'none',
        scrollTrigger: { trigger: document.body, start: 'top top', end: 'bottom bottom', scrub: 2.5 },
      });
    }
  }

  window.addEventListener('load', () => setTimeout(init, 180));
})();

// ── Hero canvas: A (living particles) + C (cursor blooms) ──────
function initHeroCanvas() {
  const canvas = document.getElementById('hero-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const hero = document.querySelector('.scene-hero');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    canvas.width  = hero.offsetWidth;
    canvas.height = hero.offsetHeight;
  }
  resize();
  new ResizeObserver(resize).observe(hero);

  // ── A: Drifting micro-particles (floaters) — disabled; FaultyTerminal is the hero bg texture ──
  const N = 0;
  const pts = Array.from({ length: N }, () => ({
    x:   Math.random(),
    y:   Math.random(),
    sz:  0.7 + Math.random() * 2,
    op:  0.07 + Math.random() * 0.25,
    spd: 0.00007 + Math.random() * 0.00018,
    ang: Math.random() * Math.PI * 2,
    ph:  Math.random() * Math.PI * 2,
    fr:  0.28 + Math.random() * 0.55,
    vx:  0, vy: 0,
    lav: Math.random() < 0.25,
  }));

  // ── C: Cursor bloom stamps ──
  const blooms = [];
  let cx = -1, cy = -1, lbx = -1, lby = -1;

  hero.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    cx = e.clientX - r.left;
    cy = e.clientY - r.top;
    const dx = cx - lbx, dy = cy - lby;
    if (dx * dx + dy * dy > 40) {
      blooms.push({ x: cx, y: cy, op: 0.10 + Math.random() * 0.07, r: 44 + Math.random() * 38 });
      lbx = cx; lby = cy;
    }
  }, { passive: true });
  hero.addEventListener('mouseleave', () => { cx = -1; cy = -1; });

  let t = 0, alive = true;
  function tick() {
    if (!alive) return;
    requestAnimationFrame(tick);
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // Blooms
    for (let i = blooms.length - 1; i >= 0; i--) {
      const b = blooms[i];
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0,    `rgba(160,200,255,${b.op.toFixed(3)})`);
      g.addColorStop(0.42, `rgba(160,200,255,${(b.op * 0.28).toFixed(3)})`);
      g.addColorStop(1,    'rgba(160,200,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      b.op *= 0.925; b.r *= 1.014;
      if (b.op < 0.004) blooms.splice(i, 1);
    }

    // Particles
    pts.forEach(p => {
      if (!reduced) {
        // Two-frequency noise
        const nx = Math.sin(p.x * 4.3 + t * p.fr + p.ph) * 0.5
                 + Math.sin(p.y * 3.2 + t * p.fr * 1.4) * 0.5;
        const ny = Math.cos(p.y * 3.9 + t * p.fr + p.ph) * 0.5
                 + Math.cos(p.x * 4.6 + t * p.fr * 0.85) * 0.5;
        p.vx += nx * 0.00042;
        p.vy += ny * 0.00042;

        // Cursor repulsion
        if (cx >= 0) {
          const px = p.x * W, py = p.y * H;
          const ddx = px - cx, ddy = py - cy;
          const d2 = ddx * ddx + ddy * ddy;
          const R = 115;
          if (d2 < R * R && d2 > 0.01) {
            const d = Math.sqrt(d2);
            const f = ((R - d) / R) * 0.0065;
            p.vx += (ddx / d) * f;
            p.vy += (ddy / d) * f;
          }
        }

        p.vx *= 0.965; p.vy *= 0.965;
        p.x += p.vx + Math.cos(p.ang) * p.spd;
        p.y += p.vy + Math.sin(p.ang) * p.spd;
        p.ang += 0.0018;

        if (p.x < -0.02) p.x = 1.02; else if (p.x > 1.02) p.x = -0.02;
        if (p.y < -0.02) p.y = 1.02; else if (p.y > 1.02) p.y = -0.02;
      }

      const col = p.lav ? '196,176,255' : '160,200,255';
      const op  = reduced ? p.op * 0.35 : p.op;
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.sz, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${col},${op.toFixed(3)})`;
      ctx.fill();
    });

    t += 0.0038;
  }

  tick();
  new IntersectionObserver(entries => {
    alive = entries[0].isIntersecting;
    if (alive) tick();
  }, { threshold: 0.01 }).observe(hero);
}

function initFallback() {
  gsap.set(['.hero-heading .char'], { clearProps: 'all' });
  document.querySelectorAll('[data-split-reveal] .ch').forEach(el => { el.style.clipPath = 'none'; });
  document.querySelectorAll('.skill-card').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });
}
</script>
