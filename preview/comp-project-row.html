<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="border-top:0.5px solid var(--border);border-bottom:0.5px solid var(--border);padding-block:20px;display:grid;grid-template-columns:1fr 1fr;gap:24px;">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <span style="font-family:'Space Mono',monospace;font-size:11px;color:var(--fg3);">01</span>
        <div style="font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--fg1);line-height:1.1;">Project Name</div>
        <div style="display:flex;gap:6px;margin-top:4px;"><span style="font-family:'Space Mono',monospace;font-size:11px;padding:3px 9px;border-radius:4px;background:var(--navy-mid);color:var(--fg2);border:0.5px solid var(--border);">React</span><span style="font-family:'Space Mono',monospace;font-size:11px;padding:3px 9px;border-radius:4px;background:rgba(114,173,255,0.10);color:var(--blue-300);border:0.5px solid rgba(160,200,255,0.25);">Featured</span></div>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:center;gap:10px;padding-left:12px;">
        <p style="font-family:'DM Sans',sans-serif;font-size:13px;color:var(--fg2);line-height:1.6;">A short description of what this project does, the problem it solves, and what makes it interesting.</p>
        <span style="font-family:'Syne',sans-serif;font-size:20px;color:var(--blue-400);">↗</span>
      </div>
    </div>
  </div></body></html>
