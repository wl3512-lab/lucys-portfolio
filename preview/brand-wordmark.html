<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
      <div style="background:var(--void);border-radius:12px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;min-height:110px;">
        <span style="font-family:var(--font-code);font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(160,200,255,0.5);">Primary</span>
        <span style="font-family:'Syne',sans-serif;font-weight:700;color:var(--cloud);font-size:26px;letter-spacing:-0.02em;">lucy liu</span>
      </div>
      <div style="background:var(--cloud);border-radius:12px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;min-height:110px;border:1px solid var(--border);">
        <span style="font-family:var(--font-code);font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(10,15,42,0.4);">Light</span>
        <span style="font-family:'Syne',sans-serif;font-weight:700;color:var(--navy);font-size:26px;letter-spacing:-0.02em;">lucy liu</span>
      </div>
      <div style="background:linear-gradient(140deg,#C8DEFF,#E8E0FF);border-radius:12px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;min-height:110px;">
        <span style="font-family:var(--font-code);font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(74,143,239,0.7);">Aura</span>
        <span style="font-family:'Syne',sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.02em;background:linear-gradient(135deg,#4A8FEF,#C4B0FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">lucy liu</span>
      </div>
    </div>
  </div></body></html>
