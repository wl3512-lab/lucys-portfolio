<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;">
      <div><div style="background:var(--void);height:84px;border-radius:8px;border:1px solid var(--border);"></div><div style="font-family:var(--font-ui);font-size:12px;margin-top:8px;color:var(--fg1);font-weight:600;">Void</div><div style="font-family:var(--font-code);font-size:10px;color:var(--fg3);margin-top:2px;">#050710</div></div>
      <div><div style="background:var(--navy);height:84px;border-radius:8px;"></div><div style="font-family:var(--font-ui);font-size:12px;margin-top:8px;color:var(--fg1);font-weight:600;">Deep Space</div><div style="font-family:var(--font-code);font-size:10px;color:var(--fg3);margin-top:2px;">#0A0F2A</div></div>
      <div><div style="background:var(--navy-mid);height:84px;border-radius:8px;"></div><div style="font-family:var(--font-ui);font-size:12px;margin-top:8px;color:var(--fg1);font-weight:600;">Navy Mid</div><div style="font-family:var(--font-code);font-size:10px;color:var(--fg3);margin-top:2px;">#141930</div></div>
      <div><div style="background:var(--navy-light);height:84px;border-radius:8px;"></div><div style="font-family:var(--font-ui);font-size:12px;margin-top:8px;color:var(--fg1);font-weight:600;">Navy Light</div><div style="font-family:var(--font-code);font-size:10px;color:var(--fg3);margin-top:2px;">#1E2640</div></div>
    </div>
  </div></body></html>
