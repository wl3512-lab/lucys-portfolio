<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="position:relative;background:var(--navy);height:140px;border-radius:12px;overflow:hidden;">
      <div style="position:absolute;top:50%;left:30%;transform:translate(-50%,-50%);">
        <div style="position:absolute;width:6px;height:6px;background:var(--blue-400);border-radius:50%;transform:translate(-50%,-50%);"></div>
        <div style="position:absolute;width:36px;height:36px;border:1px solid rgba(160,200,255,0.45);border-radius:50%;transform:translate(-50%,-50%);"></div>
      </div>
      <div style="position:absolute;top:50%;left:70%;transform:translate(-50%,-50%);">
        <div style="position:absolute;width:56px;height:56px;border:1px solid rgba(160,200,255,0.7);border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;"><span style="font-family:'Space Mono',monospace;font-size:9px;color:var(--blue-300);letter-spacing:0.1em;text-transform:uppercase;">view ↗</span></div>
      </div>
      <div style="position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--font-code);font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.14em;">default · hovering</div>
    </div>
  </div></body></html>
