<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div>
        <div style="background:var(--aura);height:110px;border-radius:12px;"></div>
        <div style="font-family:var(--font-ui);font-size:13px;margin-top:10px;color:var(--fg1);font-weight:600;">Aura Gradient</div>
        <div style="font-family:var(--font-code);font-size:10px;color:var(--fg3);margin-top:2px;">135deg · #A0C8FF → #C4B0FF → #8EC4FF</div>
      </div>
      <div>
        <div style="background:#07080F;height:110px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">
          <div style="width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(160,200,255,0.5) 0%,rgba(196,176,255,0.2) 40%,transparent 70%);"></div>
        </div>
        <div style="font-family:var(--font-ui);font-size:13px;margin-top:10px;color:var(--fg1);font-weight:600;">Aura Radial (Orb)</div>
        <div style="font-family:var(--font-code);font-size:10px;color:var(--fg3);margin-top:2px;">radial-gradient · atmospheric glow</div>
      </div>
    </div>
  </div></body></html>
