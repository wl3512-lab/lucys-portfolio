<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
      
        <div style="background:var(--navy);border-radius:12px;padding:18px;position:relative;overflow:hidden;min-height:120px;">
          <div style="position:absolute;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(160,200,255,0.2),transparent 70%);top:-30px;right:-30px;"></div>
          <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:rgba(160,200,255,0.12);line-height:1;margin-bottom:8px;position:relative;">01</div>
          <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--fg1);margin-bottom:4px;position:relative;">Liminal</div>
          <p style="font-family:'DM Sans',sans-serif;font-size:11px;font-weight:300;color:var(--fg2);line-height:1.5;position:relative;">Between physical and digital</p>
        </div>
        <div style="background:var(--navy);border-radius:12px;padding:18px;position:relative;overflow:hidden;min-height:120px;">
          <div style="position:absolute;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(160,200,255,0.2),transparent 70%);top:-30px;right:-30px;"></div>
          <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:rgba(160,200,255,0.12);line-height:1;margin-bottom:8px;position:relative;">02</div>
          <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--fg1);margin-bottom:4px;position:relative;">Precise</div>
          <p style="font-family:'DM Sans',sans-serif;font-size:11px;font-weight:300;color:var(--fg2);line-height:1.5;position:relative;">Considered risk-taking</p>
        </div>
        <div style="background:var(--navy);border-radius:12px;padding:18px;position:relative;overflow:hidden;min-height:120px;">
          <div style="position:absolute;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(160,200,255,0.2),transparent 70%);top:-30px;right:-30px;"></div>
          <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:rgba(160,200,255,0.12);line-height:1;margin-bottom:8px;position:relative;">03</div>
          <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--fg1);margin-bottom:4px;position:relative;">Human</div>
          <p style="font-family:'DM Sans',sans-serif;font-size:11px;font-weight:300;color:var(--fg2);line-height:1.5;position:relative;">Futurism in service of people</p>
        </div>
    </div>
  </div></body></html>
