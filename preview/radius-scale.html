<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:40px;height:40px;background:var(--aura);border-radius:4px;flex-shrink:0;"></div>
          <span style="font-family:var(--font-code);font-size:11px;color:var(--fg1);flex:1;">--radius-sm</span>
          <span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">4px · inputs</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:40px;height:40px;background:var(--aura);border-radius:8px;flex-shrink:0;"></div>
          <span style="font-family:var(--font-code);font-size:11px;color:var(--fg1);flex:1;">--radius-md</span>
          <span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">8px · buttons</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:40px;height:40px;background:var(--aura);border-radius:12px;flex-shrink:0;"></div>
          <span style="font-family:var(--font-code);font-size:11px;color:var(--fg1);flex:1;">--radius-lg</span>
          <span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">12px · cards</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:40px;height:40px;background:var(--aura);border-radius:20px;flex-shrink:0;"></div>
          <span style="font-family:var(--font-code);font-size:11px;color:var(--fg1);flex:1;">--radius-xl</span>
          <span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">20px · sections</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:40px;height:40px;background:var(--aura);border-radius:999px;flex-shrink:0;"></div>
          <span style="font-family:var(--font-code);font-size:11px;color:var(--fg1);flex:1;">--radius-full</span>
          <span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">999 · pills, tags</span>
        </div>
    </div>
  </div></body></html>
