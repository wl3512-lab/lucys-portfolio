<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:8px;"><span style="font-family:'Playfair Display';font-size:44px;font-weight:700;line-height:1;color:var(--fg1);letter-spacing:-0.02em;">9xl</span><span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">--text-9xl · hero</span></div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:8px;"><span style="font-family:'Playfair Display';font-size:32px;font-weight:700;line-height:1;color:var(--fg1);">6xl</span><span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">--text-6xl · h1</span></div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:8px;"><span style="font-family:'Playfair Display';font-size:22px;font-weight:700;color:var(--fg1);">4xl</span><span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">--text-4xl · h2</span></div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;"><span style="font-family:var(--font-body);font-size:16px;color:var(--fg2);">base</span><span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">--text-base · body</span></div>
    </div>
  </div></body></html>
