<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <div style="font-family:var(--font-code);font-size:10px;color:var(--blue-400);text-transform:uppercase;letter-spacing:0.14em;margin-bottom:8px;">Unicode arrows</div>
        <div style="display:flex;gap:16px;font-family:'Syne',sans-serif;font-size:22px;color:var(--fg1);">
          <span>↗ <span style="font-size:11px;color:var(--fg3);font-family:var(--font-code);">external</span></span>
          <span>↓ <span style="font-size:11px;color:var(--fg3);font-family:var(--font-code);">download</span></span>
          <span>→ <span style="font-size:11px;color:var(--fg3);font-family:var(--font-code);">next</span></span>
          <span>✦ <span style="font-size:11px;color:var(--fg3);font-family:var(--font-code);">favicon only</span></span>
        </div>
      </div>
      <div>
        <div style="font-family:var(--font-code);font-size:10px;color:var(--blue-400);text-transform:uppercase;letter-spacing:0.14em;margin-bottom:8px;">Tool logo watermarks</div>
        <div style="display:flex;gap:12px;align-items:center;">
          <img src="../assets/icons/figma.png" style="width:28px;height:28px;opacity:0.55;object-fit:contain;">
          <img src="../assets/icons/p5js.png" style="width:28px;height:28px;opacity:0.55;object-fit:contain;">
          <img src="../assets/icons/javascript.png" style="width:28px;height:28px;opacity:0.55;object-fit:contain;">
          <img src="../assets/icons/photoshop.png" style="width:28px;height:28px;opacity:0.55;object-fit:contain;">
          <img src="../assets/icons/claudecode.png" style="width:28px;height:28px;opacity:0.55;object-fit:contain;border-radius:6px;">
        </div>
      </div>
    </div>
  </div></body></html>
