<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;">
      <div><div style="background:#E8E0FF;height:84px;border-radius:8px;"></div><div style="font-family:var(--font-ui);font-size:12px;margin-top:8px;color:var(--fg1);font-weight:600;">Lavender Light</div><div style="font-family:var(--font-code);font-size:10px;color:var(--fg3);margin-top:2px;">#E8E0FF</div></div>
      <div><div style="background:#C4B0FF;height:84px;border-radius:8px;"></div><div style="font-family:var(--font-ui);font-size:12px;margin-top:8px;color:var(--fg1);font-weight:600;">Lavender</div><div style="font-family:var(--font-code);font-size:10px;color:var(--fg3);margin-top:2px;">#C4B0FF</div></div>
      <div><div style="background:#E2EEFF;height:84px;border-radius:8px;"></div><div style="font-family:var(--font-ui);font-size:12px;margin-top:8px;color:var(--fg1);font-weight:600;">Mist</div><div style="font-family:var(--font-code);font-size:10px;color:var(--fg3);margin-top:2px;">#E2EEFF</div></div>
      <div><div style="background:#F6FAFF;height:84px;border-radius:8px;border:1px solid var(--border);"></div><div style="font-family:var(--font-ui);font-size:12px;margin-top:8px;color:var(--fg1);font-weight:600;">Cloud White</div><div style="font-family:var(--font-code);font-size:10px;color:var(--fg3);margin-top:2px;">#F6FAFF · text</div></div>
    </div>
  </div></body></html>
