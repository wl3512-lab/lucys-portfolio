<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <button style="background:var(--blue-400);color:var(--void);font-family:'Syne',sans-serif;font-size:13px;font-weight:600;padding:11px 22px;border-radius:4px;border:none;letter-spacing:0.02em;">View my work ↓</button>
        <button style="background:transparent;color:var(--fg1);font-family:'Syne',sans-serif;font-size:13px;padding:10px 22px;border-radius:4px;border:1px solid var(--border-strong);">Resume ↓</button>
        <button style="background:transparent;color:var(--fg2);font-family:'Syne',sans-serif;font-size:13px;padding:10px 0;border:none;">GitHub →</button>
      </div>
      <div style="display:flex;gap:14px;font-family:var(--font-code);font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.14em;">
        <span style="flex:1;text-align:center;">Primary</span>
        <span style="flex:1;text-align:center;">Secondary</span>
        <span style="flex:1;text-align:center;">Ghost</span>
      </div>
    </div>
  </div></body></html>
