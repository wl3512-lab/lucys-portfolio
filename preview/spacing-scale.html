<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:4px;height:10px;background:var(--aura);border-radius:3px;flex-shrink:0;"></div>
          <span style="font-family:var(--font-code);font-size:11px;color:var(--fg1);flex:1;">--space-1</span>
          <span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">4px</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:8px;height:10px;background:var(--aura);border-radius:3px;flex-shrink:0;"></div>
          <span style="font-family:var(--font-code);font-size:11px;color:var(--fg1);flex:1;">--space-2</span>
          <span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">8px</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:16px;height:10px;background:var(--aura);border-radius:3px;flex-shrink:0;"></div>
          <span style="font-family:var(--font-code);font-size:11px;color:var(--fg1);flex:1;">--space-4</span>
          <span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">16px</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:24px;height:10px;background:var(--aura);border-radius:3px;flex-shrink:0;"></div>
          <span style="font-family:var(--font-code);font-size:11px;color:var(--fg1);flex:1;">--space-6</span>
          <span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">24px</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:40px;height:10px;background:var(--aura);border-radius:3px;flex-shrink:0;"></div>
          <span style="font-family:var(--font-code);font-size:11px;color:var(--fg1);flex:1;">--space-10</span>
          <span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">40px</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:64px;height:10px;background:var(--aura);border-radius:3px;flex-shrink:0;"></div>
          <span style="font-family:var(--font-code);font-size:11px;color:var(--fg1);flex:1;">--space-16</span>
          <span style="font-family:var(--font-code);font-size:10px;color:var(--fg3);">64px</span>
        </div>
    </div>
  </div></body></html>
