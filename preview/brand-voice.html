<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div style="background:var(--navy);border-radius:10px;padding:14px;border-top:3px solid var(--blue-400);">
        <div style="font-family:'Syne',sans-serif;font-size:13px;color:var(--fg1);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--blue-400);"></span>Do</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:11px;color:var(--fg2);line-height:1.6;">→ Lowercase wordmark<br>→ Specificity over buzzwords<br>→ First person, owned voice<br>→ Em dashes + arrows</div>
      </div>
      <div style="background:var(--navy);border-radius:10px;padding:14px;border-top:3px solid #E8B4C0;">
        <div style="font-family:'Syne',sans-serif;font-size:13px;color:var(--fg1);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:50%;background:#E8B4C0;"></span>Don't</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:11px;color:var(--fg2);line-height:1.6;">→ Exclamation marks<br>→ "Synergy", "disruptive"<br>→ Emoji<br>→ Passive voice</div>
      </div>
    </div>
  </div></body></html>
