<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(160,200,255,0.1);border-radius:12px;padding:18px;">
      <label style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(160,200,255,0.5);display:block;margin-bottom:8px;">Get in touch</label>
      <input type="text" value="your@email.com" readonly style="background:rgba(255,255,255,0.04);border:1px solid rgba(160,200,255,0.15);border-radius:8px;padding:11px 16px;width:100%;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:300;color:rgba(235,243,255,0.4);outline:none;">
      <div style="margin-top:12px;display:flex;justify-content:flex-end;"><button style="background:var(--blue-400);color:var(--void);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;padding:8px 16px;border-radius:4px;border:none;">Send →</button></div>
    </div>
  </div></body></html>
