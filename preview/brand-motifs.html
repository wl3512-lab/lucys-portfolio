<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;">
      <div>
        <div style="background:#07080F;height:78px;border-radius:10px;display:flex;align-items:center;justify-content:center;"><div style="width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(160,200,255,0.5) 0%,rgba(196,176,255,0.2) 40%,transparent 70%);"></div></div>
        <div style="font-family:var(--font-ui);font-size:11px;margin-top:6px;color:var(--fg1);font-weight:600;">Aura Glow</div>
      </div>
      <div>
        <div style="background:var(--navy);height:78px;border-radius:10px;background-image:linear-gradient(rgba(160,200,255,0.12) 1px,transparent 1px),linear-gradient(90deg,rgba(160,200,255,0.12) 1px,transparent 1px);background-size:14px 14px;"></div>
        <div style="font-family:var(--font-ui);font-size:11px;margin-top:6px;color:var(--fg1);font-weight:600;">Fine Grid</div>
      </div>
      <div>
        <div style="background:var(--void);height:78px;border-radius:10px;display:flex;align-items:center;justify-content:center;"><div style="width:80%;height:2px;background:linear-gradient(90deg,transparent,#A0C8FF,#C4B0FF,transparent);border-radius:4px;box-shadow:0 0 12px rgba(160,200,255,0.5);"></div></div>
        <div style="font-family:var(--font-ui);font-size:11px;margin-top:6px;color:var(--fg1);font-weight:600;">Aura Streak</div>
      </div>
      <div>
        <div style="background:linear-gradient(135deg,var(--navy),var(--navy-light));height:78px;border-radius:10px;display:flex;align-items:center;justify-content:center;"><div style="width:70px;height:44px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(160,200,255,0.18);backdrop-filter:blur(8px);"></div></div>
        <div style="font-family:var(--font-ui);font-size:11px;margin-top:6px;color:var(--fg1);font-weight:600;">Frosted Glass</div>
      </div>
    </div>
  </div></body></html>
