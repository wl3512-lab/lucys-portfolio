<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--fg1);font-family:var(--font-body);padding:20px;min-height:150px}
.card{padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
</style></head><body class="card"><div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <span style="display:inline-block;font-family:'Space Mono',monospace;font-size:11px;padding:4px 10px;border-radius:4px;background:var(--navy-mid);color:var(--fg2);border:0.5px solid var(--border);">User Research</span>
        <span style="display:inline-block;font-family:'Space Mono',monospace;font-size:11px;padding:4px 10px;border-radius:4px;background:var(--navy-mid);color:var(--fg2);border:0.5px solid var(--border);">Accessibility</span>
        <span style="display:inline-block;font-family:'Space Mono',monospace;font-size:11px;padding:4px 10px;border-radius:4px;background:var(--navy-mid);color:var(--fg2);border:0.5px solid var(--border);">Figma</span>
        <span style="display:inline-block;font-family:'Space Mono',monospace;font-size:11px;padding:4px 10px;border-radius:4px;background:rgba(114,173,255,0.10);color:var(--blue-300);border:0.5px solid rgba(160,200,255,0.25);">Featured</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <span style="display:inline-block;font-family:'Space Mono',monospace;font-size:9px;padding:4px 10px;border-radius:999px;border:1px solid rgba(160,200,255,0.2);color:rgba(160,200,255,0.65);text-transform:uppercase;letter-spacing:0.1em;">NYU IMA</span>
        <span style="display:inline-block;font-family:'Space Mono',monospace;font-size:9px;padding:4px 10px;border-radius:999px;border:1px solid rgba(160,200,255,0.2);color:rgba(160,200,255,0.65);text-transform:uppercase;letter-spacing:0.1em;">XR</span>
      </div>
    </div>
  </div></body></html>
