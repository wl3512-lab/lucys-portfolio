<!doctype html><html lang="en"><head><meta charset="utf-8">
<!--
  Driftwood hover cover (2026-11-10), the short cut of the trailer in ../driftwood-trailer/. A 7.5 s loop, silent.

  Cut from the trailer's own export (../driftwood-trailer/reel.mp4; re-export this after the trailer): the CRT title
  screen, Ember's greeting in his speech bubble, "Then something is off.", his flaw, and the training room with the
  three rules holding (2026-11-11, Lucy: no chat window, no game UI for the rules).

  Ember's lines on screen are the game's own (sketch.js): the greeting (PET_DEFS fox.greeting) and the flaw
  (generateLocalReply, case "fox", pain): "Real talk, Lucy: tooth hurting, head hurting, whatever? Pop something
  strong and keep the day moving." "THEN SOMETHING IS OFF." is from the game's docs/video-shot-list.md.

  Frame 0 and the last frame are the title screen, so the loop is seamless and the poster is the title.
    node scripts/cover-reel.mjs --cover=driftwood --sheet
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=block">
<style>
:root { --void:#030504; --red:#ff5a4e; --line:#16261c; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--void); }
.stage { position:relative; width:720px; height:480px; overflow:hidden; background:var(--void); }
.layer { position:absolute; inset:0; visibility:hidden; }
#film { position:absolute; inset:0; width:720px; height:480px; display:block; }
.card { background:radial-gradient(ellipse at 50% 55%,#0b1a11 0%,#050a07 55%,var(--void) 100%); display:flex; align-items:center; justify-content:center; text-align:center; }
.card::before { content:''; position:absolute; inset:0; opacity:.35;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:24px 24px;
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%); }
.card::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px); }
.big { position:relative; font:400 80px/.92 'Bebas Neue',sans-serif; letter-spacing:.02em; color:var(--red); }
.big span { display:block; }
.dip { position:absolute; inset:0; background:var(--void); opacity:0; z-index:8; }
</style></head><body>
<div class="stage">
 <div class="layer" id="filmL"><video id="film" src="../driftwood-trailer/reel.mp4" muted playsinline preload="auto"></video></div>
 <section class="layer card" id="cOff"><div class="big"><span>Then something</span><span>is off.</span></div></section>
 <div class="dip" id="dip"></div>
</div>
<script>
(function(){
 const FPS=30;
 // Times in the trailer's own export (../driftwood-trailer/reel.mp4): its title, Ember's bubble, the turn, his flaw, the rules holding.
 const SHOTS={splash:[0,1.1],greeting:[8.7,1.3],off:[10.8333,0.6],flaw:[12.6,1.9],train:[16.95,1.7]};
 // [kind, id, length, push-in origin]; the closing 'back' returns to the title screen's first frame.
 const PLAN=[['shot','splash',1.1,'50% 30%'],['shot','greeting',1.3,'40% 40%'],['shot','off',0.6,'50% 50%'],['shot','flaw',1.9,'40% 40%'],
  ['shot','train',1.7,'30% 50%'],['back','splash',0.4]];
 let acc=0; PLAN.forEach(p=>{p.t0=acc; acc+=p[2];});
 const duration=Math.round(acc*FPS)/FPS, total=Math.round(duration*FPS);
 const $=id=>document.getElementById(id), film=$('film'), clamp=x=>Math.max(0,Math.min(1,x));
 function show(id){['filmL','cOff'].forEach(l=>{$(l).style.visibility=l===id?'visible':'hidden';});}
 function seek(time){return new Promise(res=>{
  if(Math.abs(film.currentTime-time)<1e-4&&film.readyState>=2){res();return;}
  const done=()=>{film.removeEventListener('seeked',done);res();}; film.addEventListener('seeked',done); film.currentTime=time;});}
 function frameOf(name,i){const s=SHOTS[name];return s[0]+(Math.min(Math.round(s[1]*FPS)-1,i)+.5)/FPS;}
 function render(t){
  const n=Math.max(0,Math.min(total-1,Math.round(t*FPS)));
  t=n/FPS;
  const p=PLAN.find(q=>t>=q.t0-1e-6&&t<q.t0+q[2]-1e-6)||PLAN[PLAN.length-1];
  const lt=t-p.t0, k=lt/p[2], prev=PLAN[PLAN.indexOf(p)-1];
  let dip=0;
  if(lt<1/FPS-1e-6&&prev&&(p[0]==='card'||prev[0]==='card'))dip=.85;
  if(p[0]==='card'){ show('cOff'); $('dip').style.opacity=dip;
   const f=Math.floor(lt*FPS+1e-6), jolt=[[-14,9],[6,-11],[0,0],[0,0],[11,-4],[0,0],[0,0],[0,0],[-5,3]], j=jolt[f]||[0,0], sp=document.querySelectorAll('#cOff span');
   sp[0].style.transform='translateX('+j[0]+'px)'; sp[1].style.transform='translateX('+j[1]+'px)'; return Promise.resolve(); }
  show('filmL');
  if(p[0]==='back'){
   // dip to black and up again onto the title screen; the last frame is frame 0 exactly
   const last=n===total-1, half=p[2]/2;
   if(lt<half){ dip=clamp(lt/half); film.style.transform='scale(1.03)'; film.style.transformOrigin='50% 50%'; $('dip').style.opacity=dip; return seek(frameOf('train',Math.round(SHOTS.train[1]*FPS)-1)); }
   dip=last?0:clamp(1-(lt-half)/half); film.style.transform='none'; $('dip').style.opacity=dip; return seek(frameOf('splash',0));
  }
  $('dip').style.opacity=dip;
  // the title holds still so frame 0 is the poster; the other shots drift in a little
  film.style.transformOrigin=p[3]; film.style.transform=p[1]==='splash'?'none':'scale('+(1+.04*k).toFixed(4)+')';
  return seek(frameOf(p[1],Math.floor(lt*FPS+1e-6)));
 }
 const fontsIn=Promise.all(['400 20px "Bebas Neue"'].map(f=>document.fonts.load(f)));
 const videoIn=new Promise(r=>{if(film.readyState>=2)r();else film.addEventListener('loadeddata',r,{once:true});});
 const ready=Promise.all([document.fonts.ready,fontsIn,videoIn]).then(()=>render(0));
 window.__reel={duration,fps:FPS,render,ready,fonts:['Bebas Neue']};
 if(!location.search.includes('export'))ready.then(()=>{let start=performance.now(),busy=false;
  function tick(now){if(!busy){busy=true;render(((now-start)/1000)%duration).then(()=>busy=false);}requestAnimationFrame(tick);}requestAnimationFrame(tick);});
})();
</script></body></html>
