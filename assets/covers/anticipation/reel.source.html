<!doctype html><html><head><meta charset="utf-8">
<!--
  Anticipation: animated cover (2026-11-09), for Other work. One artwork, so the motion is all framing:
  the piece hangs whole on a wall beside its label (frame 0, the poster and the last frame), the
  frame opens into a window and travels across the details at no more than the file's own pixels,
  then settles back to the whole piece. The artwork is never recoloured, filtered or distorted:
  it is only placed, cropped and scaled uniformly (never past its own pixels at 2x).
  Export: node scripts/cover-reel.mjs --cover=anticipation --sheet
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500&family=Space+Mono:wght@400&display=block">
<style>
:root { --accent: #e6e46a; --wall: #191b22; --wall-lit: #2d2b38; --ink: #eef1f6; --ink2: rgba(238,241,246,.72); --ink3: rgba(238,241,246,.55); --frame: #0c0d11; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--wall); }
body { -webkit-font-smoothing: antialiased; color: var(--ink); }
.stage { position: relative; width: 720px; height: 480px; overflow: hidden;
  background: radial-gradient(520px 380px at var(--lx) 18%, var(--wall-lit) 0%, transparent 72%), var(--wall); }
/* Grain lies on the wall only, under the work, so the artwork itself is never filtered. */
.grain { position: absolute; inset: 0; z-index: 0; opacity: .10; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-size: 110px 110px; }
.win { position: absolute; z-index: 2; overflow: hidden; background: var(--wall);
  box-shadow: 0 0 0 5px var(--frame), 0 0 0 6px rgba(255,255,255,.06), 0 30px 50px -22px rgba(0,0,0,.7), 0 10px 18px -8px rgba(0,0,0,.45); }
.shutter { position: absolute; inset: 0; z-index: 1; background: var(--wall); visibility: hidden; box-shadow: -2px 0 0 var(--accent), 2px 0 0 var(--accent); }
.win canvas { position: absolute; left: 0; top: 0; display: none; }
.win img { position: absolute; left: 0; top: 0; display: block; max-width: none; }
.label { position: absolute; z-index: 3; }
.kick, .chip { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); line-height: 1.3; }
.title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 31px; line-height: .98; letter-spacing: -.01em; color: var(--ink); margin-top: 10px; }
.line { font-family: 'DM Sans', sans-serif; font-weight: 400; font-size: 15px; line-height: 1.4; color: var(--ink2); margin-top: 12px; }
.rule { width: 28px; height: 2px; background: var(--accent); margin-top: 16px; }
.chips { position: absolute; z-index: 3; left: 40px; right: 40px; top: 428px; display: flex; justify-content: space-between; align-items: baseline; }
.chip b { font-weight: 400; color: var(--ink); }
.chip-name { position: absolute; left: 0; top: 0; white-space: nowrap; }
.chip-slot { position: relative; height: 16px; flex: 1; }
.chip-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--ink2); }
.label{left:486px;top:170px;width:210px}
</style></head><body>
<div class="stage" id="stage" style="--lx: 34%">
  <div class="grain"></div>
  <div class="win" id="win"><img id="art" src="../../anticipation/cover.jpg" alt=""><canvas id="still"></canvas><i class="shutter" id="shutter"></i></div>
  <div class="label" id="label">
    <p class="kick">Fine Arts · 2024</p>
    <h2 class="title">Anticipation</h2>
    <p class="line">Oil on canvas, spray paint</p>
    <div class="rule"></div>
  </div>
  <div class="chips" id="chips">
    <div class="chip-slot" id="chip-slot"></div>
    <div class="chip chip-title">Anticipation</div>
  </div>
</div>
<script>
(function () {
  const CFG = {"L": 8, "nw": 2000, "nh": 1481, "whole": {"x": 54, "y": 92, "w": 404}, "stops": [{"name": "Face", "from": [0.66, 0.25], "to": [0.655, 0.29]}, {"name": "Reflection", "from": [0.44, 0.36], "to": [0.41, 0.37]}, {"name": "Hand", "from": [0.25, 0.6], "to": [0.235, 0.57]}], "T": {"move0": 1.0, "stops": [[2.3, 3.3], [4.1, 5.0], [5.8, 6.5]], "move1": 1.0}};
  const L = CFG.L, FPS = 30;
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const X = (u) => ((ax * u + bx) * u + cx) * u, Y = (u) => ((ay * u + by) * u + cy) * u;
    const dX = (u) => (3 * ax * u + 2 * bx) * u + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let u = x;
      for (let i = 0; i < 8; i++) { const d = X(u) - x; if (Math.abs(d) < 1e-6) break; const s = dX(u); if (Math.abs(s) < 1e-6) break; u -= d / s; }
      return Y(u);
    };
  }
  const out = bezier(0.25, 1, 0.5, 1);
  const inOut = bezier(0.65, 0, 0.35, 1);
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const p = (t, at, dur) => clamp((t - at) / dur);
  const lerp = (a, b, k) => a + (b - a) * k;
  const $ = (id) => document.getElementById(id);
  const art = $('art'), win = $('win'), still = $('still');
  let stillReady = false;
  const NW = CFG.nw, NH = CFG.nh, AR = NH / NW;
  const MAXW = NW / 2;                        // 1 file px = 1 device px at the 2x export: never larger
  const WHOLE = CFG.whole;                    // { x, y, w } the whole piece, hung
  WHOLE.h = WHOLE.w * AR;
  const WIN = { x: 40, y: 30, w: 640, h: 384 };   // the detail window

  // Camera keys: { t, view: 'whole' | stop index, at: 0..1 along the stop's from->to }
  // A stop: { name, from: [fx, fy], to: [fx, fy], w } (w: displayed image width, <= MAXW).
  const STOPS = CFG.stops.map((s) => ({ ...s, w: Math.min(s.w || MAXW, MAXW) }));
  const T = CFG.T;   // { open, stops: [[arrive, leave], ...], close, rest }

  // The state at time t: window rect, image width, focus point (normalised), detail weight.
  function camera(t) {
    const whole = { r: WHOLE, w: WHOLE.w, f: [0.5, 0.5], d: 0 };
    const atStop = (i, k) => { const s = STOPS[i]; return { r: WIN, w: s.w, f: [lerp(s.from[0], s.to[0], k), lerp(s.from[1], s.to[1], k)], d: 1 }; };
    const blend = (a, b, k) => ({
      r: { x: lerp(a.r.x, b.r.x, k), y: lerp(a.r.y, b.r.y, k), w: lerp(a.r.w, b.r.w, k), h: lerp(a.r.h, b.r.h, k) },
      w: Math.exp(lerp(Math.log(a.w), Math.log(b.w), k)),
      f: [lerp(a.f[0], b.f[0], k), lerp(a.f[1], b.f[1], k)], d: lerp(a.d, b.d, k),
    });
    const S = T.stops;
    if (t < S[0][0] - T.move0) return whole;
    if (t < S[0][0]) return blend(whole, atStop(0, 0), inOut(p(t, S[0][0] - T.move0, T.move0)));
    for (let i = 0; i < S.length; i++) {
      const [a, b] = S[i];
      if (t < b) return atStop(i, 0.5 - 0.5 * Math.cos(Math.PI * p(t, a, b - a)));
      const next = S[i + 1];
      // Between stops a shutter in the frame's colour sweeps across the window; the view changes under it.
      if (next && t < next[0]) { const k = p(t, b, next[0] - b); const c = k < 0.5 ? atStop(i, 1) : atStop(i + 1, 0); c.wipe = k; return c; }
    }
    const last = S[S.length - 1][1];
    if (t < last + T.move1) return blend(atStop(S.length - 1, 1), whole, inOut(p(t, last, T.move1)));
    return whole;
  }

  function place(c) {
    const r = c.r, w = c.w, h = w * AR;
    let x = r.w / 2 - c.f[0] * w, y = r.h / 2 - c.f[1] * h;
    // keep the window covered: never show the wall through it while zoomed
    if (w >= r.w) x = Math.min(0, Math.max(r.w - w, x)); else x = (r.w - w) / 2;
    if (h >= r.h) y = Math.min(0, Math.max(r.h - h, y)); else y = (r.h - h) / 2;
    // At the file's own pixels, move by whole device pixels so the work is shown exactly, never resampled.
    if (c.d >= 1) { x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2; }
    win.style.left = r.x.toFixed(3) + 'px'; win.style.top = r.y.toFixed(3) + 'px';
    win.style.width = r.w.toFixed(3) + 'px'; win.style.height = r.h.toFixed(3) + 'px';
    art.style.width = w.toFixed(3) + 'px'; art.style.height = h.toFixed(3) + 'px';
    art.style.left = x.toFixed(3) + 'px'; art.style.top = y.toFixed(3) + 'px';
    // Hung whole (the poster and the loop's end), the work is drawn once, scaled with high quality,
    // so the first and last frames are the same pixels whatever the browser has cached.
    const isWhole = c.d === 0 && Math.abs(w - WHOLE.w) < 1e-6;
    still.style.display = isWhole && stillReady ? 'block' : 'none';
    art.style.visibility = isWhole && stillReady ? 'hidden' : 'visible';
    const sh = $('shutter'), wk = c.wipe;
    if (wk == null || wk <= 0 || wk >= 1) { sh.style.visibility = 'hidden'; }
    else {
      // in from the right, covering by the middle, then out to the left
      const e = wk < 0.5 ? inOut(wk / 0.5) : inOut((wk - 0.5) / 0.5);
      const pos = wk < 0.5 ? (1 - e) * 101 : -e * 101;
      sh.style.visibility = 'visible';
      sh.style.transform = 'translateX(' + pos.toFixed(3) + '%)';
    }
  }

  // Stop names, one at a time, rising in.
  const slot = $('chip-slot');
  const names = STOPS.map((s, i) => {
    const e = document.createElement('div'); e.className = 'chip chip-name';
    e.innerHTML = '<b>' + String(i + 1).padStart(2, '0') + '</b> · ' + s.name;
    slot.appendChild(e); return e;
  });
  const labelParts = [...$('label').children];

  function render(tIn) {
    const t = ((tIn % L) + L) % L;
    const c = camera(t);
    place(c);
    // The label leaves as the frame opens and comes back as it settles, in reading order.
    const S = T.stops, first = S[0][0] - T.move0, last = S[S.length - 1][1];
    labelParts.forEach((el, i) => {
      const leave = inOut(p(t, first + i * 0.04, 0.32));
      const back = out(p(t, last + T.move1 * 0.8 + i * 0.07, 0.4));
      const k = t < last ? 1 - leave : back;
      el.style.opacity = k.toFixed(4);
      el.style.transform = 'translateY(' + ((1 - k) * (t < last ? -8 : 10)).toFixed(2) + 'px)';
    });
    // The chips row lives only in the detail window.
    const chipsK = c.d >= 0.999 ? 1 : clamp((c.d - 0.6) / 0.4);
    $('chips').style.opacity = chipsK.toFixed(4);
    names.forEach((el, i) => {
      const [a, b] = S[i];
      const kIn = i === 0 ? 1 : out(p(t, a - 0.25, 0.35));
      const kOut = i === S.length - 1 ? 0 : inOut(p(t, b, 0.25));
      const k = t < a - 0.25 && i > 0 ? 0 : kIn * (1 - kOut);
      el.style.opacity = k.toFixed(4);
      el.style.transform = 'translateY(' + ((1 - kIn) * 8 - kOut * 8).toFixed(2) + 'px)';
    });
  }

  const ready = Promise.all([
    art.decode().catch(() => {}),
    ...['700 40px "Syne"', '400 15px "DM Sans"', '400 11px "Space Mono"'].map((f) => document.fonts.load(f).catch(() => {})),
  ]).then(() => document.fonts.ready)
    // Draw a detail view once before frame 0, so the browser has the same scaled copy of the work
    // cached for the poster as it has when the loop comes back to it (the seam is then exact).
    .then(() => createImageBitmap(art, { resizeWidth: Math.round(WHOLE.w * 2), resizeHeight: Math.round(WHOLE.h * 2), resizeQuality: 'high' }))
    .then((bmp) => {
      still.width = bmp.width; still.height = bmp.height;
      still.style.width = WHOLE.w + 'px'; still.style.height = WHOLE.h + 'px';
      still.getContext('2d').drawImage(bmp, 0, 0); stillReady = true;
      render(0); return true;
    });
  window.__reel = { render, duration: L, fps: FPS, fonts: ['Syne', 'DM Sans', 'Space Mono'], ready };
  if (!/[?&]export\b/.test(location.search)) {
    ready.then(() => { const t0 = performance.now(); const tick = (now) => { render((now - t0) / 1000); requestAnimationFrame(tick); }; requestAnimationFrame(tick); });
  } else render(0);
})();
</script>
</body></html>
