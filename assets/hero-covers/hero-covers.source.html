<!doctype html><html><head><meta charset="utf-8">
<!-- Hero covers (Lucy, 2026-11-10: "remake covers for hero, the covers rn are too detailed for small view").
     One mark each on its brand colour, no words: the hero's titles sit under them. Each .c is 900 x 600 (3:2);
     shot to assets/hero-covers/<slug>.webp by a screenshot of each element. -->
<style>
*{margin:0;box-sizing:border-box} body{background:#111;display:flex;flex-direction:column;gap:20px;padding:20px}
.c{width:900px;height:600px;position:relative;overflow:hidden;display:grid;place-items:center}
.c::after{content:'';position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#driftwood{background:radial-gradient(520px 420px at 50% 55%,#1d5a3c 0%,#0b2418 60%,#06140d 100%)}
#driftwood img{width:330px;height:330px;image-rendering:pixelated;filter:drop-shadow(0 26px 30px rgba(0,0,0,.45))}
#habitabull{background:radial-gradient(560px 420px at 40% 30%,#e3916f 0%,#d57e5c 55%,#c06a4a 100%)}
#habitabull img{height:470px;filter:drop-shadow(0 26px 30px rgba(70,25,8,.35))}
#reptools{background:radial-gradient(520px 420px at 50% 50%,#10303c 0%,#0a0d12 70%)}
#reptools svg{height:400px;fill:#22e1ff;filter:drop-shadow(0 0 40px rgba(34,225,255,.35))}
</style></head><body>
<div class="c" id="driftwood"><img src="../../icons/fox.svg" alt=""></div>
<div class="c" id="habitabull"><img src="../habitabull/mascot.png" alt=""></div>
<div class="c" id="reptools"><svg viewBox="0 0 166 200"><path d="M24.1 5 L112.1 5 L108.5 39 L56.5 39 L52.7 75 L118.7 75 L126.1 5 L162.1 5 L150.9 111 L108.8 111 L141.6 196 L105.6 196 L72.8 111 L48.9 111 L40 196 L4 196 Z"/></svg></div>
</body></html>
